name: Release Helm Chart

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: "Override version (format YYYY.M.X, no leading v). Empty = auto-increment."
        required: false
        type: string
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'kubernetes/charts/**'

jobs:
  release:
    runs-on: ubuntu-latest
    # Fire on manual dispatch OR on ANY merged PR touching the chart tree
    # (path-scoped above). The old MISP-inherited `head.ref == chore/update-versions`
    # filter never matched this repo's direct-to-main flow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    permissions:
      contents: write        # needed to push the chart-vX.Y.Z git tag
      packages: write

    env:
      CHART_DIR: kubernetes/charts/openldap-platform
      CHART_NAME: openldap-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # needed for tagging

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Convert repository owner to lowercase
        id: lowercase
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Compute chart version
        id: chart
        run: |
          set -euo pipefail
          # CalVer YYYY.M.PATCH, month NOT zero-padded, computed from the
          # calendar and the existing release tags - the same scheme the CLI
          # repository uses. It is NOT read from Chart.yaml: a stored version
          # only moves when someone remembers to move it, and forgetting is
          # what republished 2026.9.1 over the artifact a production cluster
          # pinned, swapping OpenLDAP 2.6 for 2.7 underneath it.
          FORCE='${{ inputs.force_version }}'
          if [ -n "$FORCE" ]; then
            echo "$FORCE" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' \
              || { echo "::error::force_version must be YYYY.M.X"; exit 1; }
            VERSION="$FORCE"
          else
            PREFIX="chart-v$(date -u +%Y).$(date -u +%-m)."
            LAST=$(git tag -l "${PREFIX}*" | sed "s|^${PREFIX}||" | sort -n | tail -1)
            if [ -z "$LAST" ]; then PATCH=1; else PATCH=$((LAST + 1)); fi
            VERSION="$(date -u +%Y).$(date -u +%-m).${PATCH}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=chart-v${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing chart version: $VERSION"

      - name: Refuse to overwrite a published version
        run: |
          set -euo pipefail
          VERSION='${{ steps.chart.outputs.version }}'
          REPO="ghcr.io/${{ steps.lowercase.outputs.owner }}/charts/${CHART_NAME}"
          # The registry, not a git tag: this workflow never created the
          # `chart-v*` tags the old guard looked for, so it could never fire -
          # and 2026.9.1 was republished over the exact artifact a production
          # cluster pins, swapping OpenLDAP 2.6 for 2.7 underneath it.
          #
          # An OCI tag is mutable. Overwriting one does not "release a new
          # version", it rewrites what every existing `targetRevision` already
          # resolves to.
          if helm show chart "oci://${REPO}" --version "${VERSION}" >/dev/null 2>&1; then
            echo "::error::${REPO}:${VERSION} is already published. Overwriting it would change what every consumer pinning ${VERSION} resolves to - bump the patch in every Chart.yaml and re-run."
            exit 1
          fi
          echo "${VERSION} is not published yet"

      - name: Update chart dependencies
        run: |
          # Helm PREFERS charts/*.tgz over the sibling source directories, so a
          # stale archive silently shadows every edit. Rebuild from scratch.
          rm -f ${CHART_DIR}/charts/*.tgz
          helm dependency update ${CHART_DIR}
          make -C kubernetes dep-check

      - name: Lint (fail-fast on template / values issues)
        run: |
          for chart in ${CHART_DIR}/charts/*/; do
            helm lint "$chart"
          done
          helm lint ${CHART_DIR}

      - name: Render (fail-fast on runtime template errors)
        run: |
          # `helm lint` only exercises the default values, so every optional
          # path stayed unrendered until someone deployed it. Walk the modes,
          # both HA shapes, all three TLS backends, the RO pool, the ephemeral
          # path and the sync surface. A single render on any of these is what
          # catches a template that references a volume it never declares.
          fail=0
          render() {
            name=$1; shift
            if helm template test ${CHART_DIR} "$@" > /dev/null 2>/tmp/render.err; then
              echo "ok    $name"
            else
              echo "FAIL  $name"; sed -n '1,3p' /tmp/render.err; fail=1
            fi
          }

          render standalone
          render standalone-nopersist   --set openldap.persistence.enabled=false
          render mirror                 --set openldap.mode=mirror --set openldap.replicaCount=2
          render multi-master           --set openldap.mode=multi-master --set openldap.replicaCount=3
          render no-replicate-config    --set openldap.mode=multi-master --set openldap.replicaCount=3 \
                                        --set openldap.replication.replicateConfig.enabled=false
          render readonly-pool          --set openldap.mode=mirror --set openldap.replicaCount=2 \
                                        --set openldap.readOnlyReplicas.count=2
          render tls-cert-manager       --set openldap.tls.enabled=true \
                                        --set openldap.tls.certManager.issuerRef.name=ci-issuer
          render tls-job                --set openldap.tls.enabled=true --set openldap.tls.backend=job
          render tls-provided           --set openldap.tls.enabled=true --set openldap.tls.backend=provided \
                                        --set openldap.tls.provided.secretName=ci-tls
          render monitoring             --set openldap.monitoring.enabled=true \
                                        --set openldap.monitoring.serviceMonitor.enabled=true \
                                        --set openldap.monitoring.prometheusRule.enabled=true
          render networkpolicy          --set openldap.mode=mirror --set openldap.replicaCount=2 \
                                        --set openldap.networkPolicy.enabled=true
          render subcharts-ui           --set phpldapadmin.enabled=true \
                                        --set self-service-password.enabled=true
          render ingress-nginx          --set openldap.tls.enabled=true --set openldap.tls.backend=job \
                                        --set openldap.ingress.enabled=true \
                                        --set openldap.ingress.mode=ingress-nginx \
                                        --set openldap.ingress.host=ldap.example.org
          render ingress-gateway-api    --set openldap.tls.enabled=true --set openldap.tls.backend=job \
                                        --set openldap.ingress.enabled=true \
                                        --set openldap.ingress.mode=gateway-api \
                                        --set openldap.ingress.host=ldap.example.org \
                                        --set openldap.ingress.gatewayAPI.gatewayClassName=ci-gw
          render ui-ingress-nginx       --set phpldapadmin.enabled=true \
                                        --set phpldapadmin.ingress.enabled=true \
                                        --set phpldapadmin.ingress.mode=ingress-nginx \
                                        --set phpldapadmin.ingress.host=ui.example.org \
                                        --set self-service-password.enabled=true \
                                        --set self-service-password.ingress.enabled=true \
                                        --set self-service-password.ingress.mode=ingress-nginx \
                                        --set self-service-password.ingress.host=pw.example.org
          render ui-ingress-gateway-api --set phpldapadmin.enabled=true \
                                        --set phpldapadmin.ingress.enabled=true \
                                        --set phpldapadmin.ingress.mode=gateway-api \
                                        --set phpldapadmin.ingress.host=ui.example.org \
                                        --set phpldapadmin.ingress.gatewayAPI.gatewayClassName=ci-gw
          render ui-ingress-certmanager --set phpldapadmin.enabled=true \
                                        --set phpldapadmin.ingress.enabled=true \
                                        --set phpldapadmin.ingress.mode=ingress-nginx \
                                        --set phpldapadmin.ingress.host=ui.example.org \
                                        --set phpldapadmin.ingress.tls.enabled=true \
                                        --set phpldapadmin.ingress.tls.certManager.enabled=true \
                                        --set phpldapadmin.ingress.tls.certManager.issuerRef.name=ci-issuer
          render stale-secret-cleanup   --set openldap.staleUserSecretCleanup.enabled=true
          render cronjobs-all           --set openldap.staleUserSecretCleanup.enabled=true \
                                        --set openldap.aclLintCronJob.enabled=true \
                                        --set openldap.accesslogPurgeJob.enabled=true \
                                        --set openldap.backup.enabled=true
          render hpa-and-schedule       --set openldap.mode=multi-master \
                                        --set openldap.replicaCount=2 \
                                        --set openldap.hpa.enabled=true \
                                        --set 'openldap.scaleSchedule[0].name=biz' \
                                        --set 'openldap.scaleSchedule[0].schedule=0 8 * * 1-5' \
                                        --set 'openldap.scaleSchedule[0].minReplicas=2' \
                                        --set 'openldap.scaleSchedule[0].maxReplicas=4'

          exit $fail

      - name: Check every rendered document is a well-formed manifest
        run: |
          # Three failure modes that render "successfully", parse as YAML, and
          # are only caught at apply time - or never:
          #   * a subPath mount naming a volume that is never declared;
          #   * a bare `{{ required ... }}` guard, which RETURNS its value into
          #     the manifest - it glues onto the next line, leaving a key like
          #     `host.exampleapiVersion` and no apiVersion at all;
          #   * a right-chomped action (`-}}`) directly above a literal `---`,
          #     which eats the newline and glues the separator to the previous
          #     line. The two documents merge into one, the later root keys win
          #     and the earlier manifest is dropped SILENTLY - the merged doc
          #     still has a valid apiVersion, so only duplicate root keys give
          #     it away. Hence the strict loader below.
          python3 - <<'EOF'
          import subprocess, sys, yaml


          class StrictLoader(yaml.SafeLoader):
              """SafeLoader that refuses duplicate mapping keys.

              PyYAML (and Kubernetes) silently keep the last of a duplicated key,
              which is exactly how a merged document hides an entire manifest.
              """


          def _no_dupes(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"duplicate key {key!r}", key_node.start_mark)
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping


          StrictLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, _no_dupes)
          TLS = ["--set", "openldap.tls.enabled=true", "--set", "openldap.tls.backend=job"]
          cases = {
            "default": [],
            "no-persistence": ["--set", "openldap.persistence.enabled=false"],
            "readonly-pool": ["--set", "openldap.mode=mirror",
                              "--set", "openldap.replicaCount=2",
                              "--set", "openldap.readOnlyReplicas.count=2"],
            "ingress-nginx": TLS + ["--set", "openldap.ingress.enabled=true",
                                    "--set", "openldap.ingress.mode=ingress-nginx",
                                    "--set", "openldap.ingress.host=ldap.example.org"],
            "ingress-gateway-api": TLS + ["--set", "openldap.ingress.enabled=true",
                                          "--set", "openldap.ingress.mode=gateway-api",
                                          "--set", "openldap.ingress.host=ldap.example.org",
                                          "--set", "openldap.ingress.gatewayAPI.gatewayClassName=ci-gw"],
            "cert-manager": ["--set", "openldap.tls.enabled=true",
                             "--set", "openldap.tls.certManager.issuerRef.name=ci-issuer"],
            "ui-ingress-nginx": ["--set", "phpldapadmin.enabled=true",
                                 "--set", "phpldapadmin.ingress.enabled=true",
                                 "--set", "phpldapadmin.ingress.mode=ingress-nginx",
                                 "--set", "phpldapadmin.ingress.host=ui.example.org",
                                 "--set", "self-service-password.enabled=true",
                                 "--set", "self-service-password.ingress.enabled=true",
                                 "--set", "self-service-password.ingress.mode=ingress-nginx",
                                 "--set", "self-service-password.ingress.host=pw.example.org"],
            "ui-ingress-gateway-api": ["--set", "phpldapadmin.enabled=true",
                                       "--set", "phpldapadmin.ingress.enabled=true",
                                       "--set", "phpldapadmin.ingress.mode=gateway-api",
                                       "--set", "phpldapadmin.ingress.host=ui.example.org",
                                       "--set", "phpldapadmin.ingress.gatewayAPI.gatewayClassName=ci-gw"],
            "ingress-existing-gateway": TLS + ["--set", "openldap.ingress.enabled=true",
                                              "--set", "openldap.ingress.mode=gateway-api",
                                              "--set", "openldap.ingress.host=ldap.example.org",
                                              "--set", "openldap.ingress.gatewayAPI.gatewayName=shared-gw"],
            "ui-ingress-existing-gateway": ["--set", "phpldapadmin.enabled=true",
                                            "--set", "phpldapadmin.ingress.enabled=true",
                                            "--set", "phpldapadmin.ingress.mode=gateway-api",
                                            "--set", "phpldapadmin.ingress.host=ui.example.org",
                                            "--set", "phpldapadmin.ingress.gatewayAPI.gatewayName=shared-gw"],
            "stale-secret-cleanup": ["--set", "openldap.staleUserSecretCleanup.enabled=true"],
            "ui-ingress-certmanager": ["--set", "phpldapadmin.enabled=true",
                                       "--set", "phpldapadmin.ingress.enabled=true",
                                       "--set", "phpldapadmin.ingress.mode=ingress-nginx",
                                       "--set", "phpldapadmin.ingress.host=ui.example.org",
                                       "--set", "phpldapadmin.ingress.tls.enabled=true",
                                       "--set", "phpldapadmin.ingress.tls.certManager.enabled=true",
                                       "--set", "phpldapadmin.ingress.tls.certManager.issuerRef.name=ci-issuer"],
          }
          rc = 0
          for name, extra in cases.items():
              out = subprocess.run(
                  ["helm", "template", "test", "kubernetes/charts/openldap-platform"] + extra,
                  capture_output=True, text=True)
              if out.returncode:
                  print(f"FAIL  {name}: render error"); rc = 1; continue
              try:
                  rendered = list(yaml.load_all(out.stdout, Loader=StrictLoader))
              except yaml.YAMLError as exc:
                  print(f"FAIL  {name}: {exc} "
                        f"- merged documents? check for `-}}}}` above a literal ---")
                  rc = 1
                  continue
              for doc in rendered:
                  if not doc:
                      continue
                  if not doc.get("apiVersion") or not doc.get("kind"):
                      print(f"FAIL  {name}: document without apiVersion/kind, "
                            f"keys={sorted(doc)[:4]} - a leaking `required` guard?")
                      rc = 1
                      continue
                  if doc.get("kind") not in ("StatefulSet", "Deployment", "Job", "CronJob"):
                      continue
                  spec = doc["spec"].get("template", doc["spec"]).get("spec")
                  if spec is None:
                      spec = doc["spec"]["jobTemplate"]["spec"]["template"]["spec"]
                  declared = {v["name"] for v in spec.get("volumes", [])}
                  declared |= {v["metadata"]["name"]
                               for v in doc["spec"].get("volumeClaimTemplates", [])}
                  for c in spec.get("containers", []) + spec.get("initContainers", []):
                      for m in c.get("volumeMounts", []):
                          if m["name"] not in declared:
                              print(f"FAIL  {name}: {doc['metadata']['name']}/{c['name']} "
                                    f"mounts undeclared volume {m['name']!r}")
                              rc = 1
              print(f"ok    {name}")
          sys.exit(rc)
          EOF

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          set -euo pipefail
          # --version wins over Chart.yaml, which is what makes the computed
          # CalVer authoritative. appVersion stays what the repository says:
          # it tracks the OpenLDAP release, not the chart's own cadence.
          helm package ${CHART_DIR} --version ${{ steps.chart.outputs.version }}

      - name: Push Helm chart to GHCR
        run: |
          helm push ${CHART_NAME}-${{ steps.chart.outputs.version }}.tgz oci://ghcr.io/${{ steps.lowercase.outputs.owner }}/charts

      - name: Tag the commit the release was built from
        run: |
          set -euo pipefail
          TAG='${{ steps.chart.outputs.tag }}'
          # An annotated tag records a tagger, and a runner has no git identity
          # of its own - without this the step dies on
          # "empty ident name ... not allowed". The CLI repository sidesteps it
          # by letting action-gh-release create the tag through the API; here
          # the tag is made locally, so the identity has to be set.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Idempotent: the chart is pushed first, so a re-run after a failure
          # here must be able to finish the job rather than trip over its own
          # half-done state.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on the remote - nothing to do"
            exit 0
          fi
          git tag -a "${TAG}" -m "openldap-platform ${{ steps.chart.outputs.version }}"
          git push origin "${TAG}"
