networks:
  ldap-ha:
    driver: bridge

services:
  openldap:
    image: cleanstart/openldap:2.6.13
    container_name: openldap
    hostname: openldap-${SERVER_ID:-1}
    restart: always
    # Bind on all interfaces so peers can reach this node on host port 389.
    # With REPLICATE_CONFIG=true, setup-node.sh generates a
    # docker-compose.override.yml that switches this service to
    # network_mode: host and resets networks/ports/hostname - slapd then
    # binds the docker host address carried in olcServerID.
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      # Exec form, no shell: the image is distroless. ldapsearch on the root
      # DSE is the cheapest proof that slapd is actually answering, not just
      # that the process is up.
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1:389", "-b", "", "-s", "base", "namingContexts"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # slapd binds privileged 389 (and 636 with TLS).
      - NET_BIND_SERVICE
      # The image's entrypoint starts slapd as root with `-u ldap -g ldap`, so
      # it drops privileges itself. Without these two, setgroups() fails with
      # "Could not set the group access (gid) list" and slapd exits at boot.
      - SETUID
      - SETGID
    tmpfs:
      # Only writable path outside the data volumes - slapd drops its pid and
      # args files here. Matches the Kubernetes chart's emptyDir.
      # mode=1777 (sticky, like /tmp) rather than uid=/gid=: slapd runs as the
      # image's ldap user, whose ids move between builds of this mutable tag,
      # and hardcoding them here is exactly the bug fixed in setup.sh/certs.sh.
      - /run/openldap:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.25"
          memory: 512m
    volumes:
      - ./data/slapd.d:/etc/openldap/slapd.d
      - ./data/openldap-data:/var/lib/openldap/openldap-data
      - ./data/accesslog-data:/var/lib/openldap/accesslog-data
      - ./backup:/backup
      - ./certs:/etc/openldap/certs:ro
    networks:
      - ldap-ha
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  haproxy:
    image: haproxy:3.4.2-alpine
    container_name: haproxy-ldap
    hostname: haproxy-${SERVER_ID:-1}
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.05"
          memory: 64m
    ports:
      - "1389:1389" # client-facing LB port (LDAP)
      - "1636:1636" # client-facing LB port (LDAPS, if TLS enabled)
      - "8404:8404" # HAProxy stats
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - ldap-ha
    depends_on:
      openldap:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  phpldapadmin:
    image: phpldapadmin/phpldapadmin:2.3.11
    container_name: phpldapadmin
    hostname: phpldapadmin
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.05"
          memory: 64m
    # Opt-in only: setup-node.sh passes `--profile ui` when ENABLE_PHPLDAPADMIN
    # is true. Without this key the service carries no profile, so compose
    # starts it unconditionally - on every node, whatever the flag says.
    profiles:
      - ui
    ports:
      - "8080:8080"
    environment:
      # Laravel signs sessions and encrypts cookies with this. A value shared
      # by every deployment is a real secret, not a placeholder - the setup
      # script generates one per deployment into .env (gitignored).
      - APP_KEY=${PHPLDAPADMIN_APP_KEY:?run setup.sh/setup-node.sh first - it generates PHPLDAPADMIN_APP_KEY into .env}
      - APP_TIMEZONE=Europe/Paris
      - APP_URL=http://localhost:8080
      - LDAP_HOST=haproxy
      - LDAP_CONNECTION=ldap
      - LDAP_PORT=1389
      - LDAP_BASE_DN=dc=example,dc=org
      - LDAP_USERNAME=cn=phpldapadmin,ou=service-accounts,dc=example,dc=org
      - LDAP_PASSWORD=phpldapadmin
      - LDAP_LOGIN_ATTR=uid
      - LDAP_LOGIN_ATTR_DESC=Username
    networks:
      - ldap-ha
    depends_on:
      haproxy:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Prometheus exporter for cn=Monitor. Opt-in (`--profile metrics` /
  # ENABLE_EXPORTER=true). Binds as the cn=config admin because the monitor
  # database's ACL grants read to that DN only.
  openldap-exporter:
    image: ghcr.io/maximewewer/openldap_prometheus_exporter:2026.9.1
    container_name: openldap-exporter
    hostname: openldap-exporter-${SERVER_ID:-1}
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.02"
          memory: 32m
    profiles:
      - metrics
    ports:
      - "9330:9330"
    environment:
      - LDAP_URL=ldap://openldap:389
      - LDAP_USERNAME=cn=adminconfig,cn=config
      - LDAP_PASSWORD=${CONFIG_ADMIN_PASSWORD:-adminpasswordconfig}
      - LDAP_SERVER_NAME=openldap-${SERVER_ID:-1}
      - LISTEN_ADDRESS=:9330
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-ha
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Self Service Password - end-user password change. Same `ui` profile as
  # phpLDAPadmin; binds through HAProxy so it follows the active master.
  selfservice-password:
    image: ltbproject/self-service-password:1.8.1
    container_name: selfservice-password
    hostname: selfservice-password
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.05"
          memory: 64m
    profiles:
      - ui
    ports:
      - "8088:80"
    volumes:
      - ./ssp.conf.php:/var/www/conf/config.inc.local.php
    depends_on:
      haproxy:
        condition: service_started
    networks:
      - ldap-ha
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
