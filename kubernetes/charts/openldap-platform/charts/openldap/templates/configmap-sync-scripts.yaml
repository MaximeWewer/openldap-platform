{{- /*
Shell scripts used by the sync Jobs. All three (ppolicy / users / groups)
share the same base image (alpine) and the same tooling boot: apk install,
download openldap-cli + kubectl, then run one of the scripts below.

Each script is idempotent - safe to re-run on every `helm upgrade`.
*/ -}}
{{- if or .Values.users .Values.groups .Values.policies .Values.acls .Values.treeGrants .Values.overlays .Values.backup.enabled .Values.accesslogPurgeJob.enabled .Values.aclLintCronJob.enabled .Values.staleUserSecretCleanup.enabled (and .Values.tls.enabled .Values.tlsCheckCronJob.enabled) -}}
{{- $suffix := .Values.directory.suffix -}}
{{- $userOU := "ou=users" -}}
{{- $groupOU := "ou=groups" -}}
{{- $policyOU := "ou=policies" -}}
{{- $mailDomain := printf "%s.%s" (index (splitList "," $suffix) 0 | trimPrefix "dc=") (index (splitList "," $suffix) 1 | trimPrefix "dc=") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openldap.fullname" . }}-sync-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
data:

  # ---------------------------------------------------------------------------
  # common.sh - sourced by every sync script.
  #   * installs runtime tools (openldap-cli, kubectl, curl, jq)
  #   * writes ~/.openldap-cli.yaml with the release's admin binding
  #   * waits for LDAP to accept binds
  # ---------------------------------------------------------------------------
  common.sh: |{{ include "openldap.script.common" . | nindent 4 }}
  ppolicy.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap

    [ -f /spec/policies.json ] || { LOG "no policies to reconcile"; exit 0; }
    COUNT=$(jq 'length' /spec/policies.json)
    LOG "reconciling ${COUNT} ppolicy template(s)"

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      NAME=$(jq -r ".[$i].cn" /spec/policies.json)
      [ -n "$NAME" ] && [ "$NAME" != "null" ] || DIE "policy #$i has no cn"

      # Build --flag=value list from every remaining key.
      FLAGS=$(jq -r --argjson i "$i" '
        .[$i] | to_entries | map(select(.key != "cn"))
              | map("--" + .key + "=" + (.value | tostring)) | join(" ")
      ' /spec/policies.json)

      LOG "ppolicy set ${NAME} ${FLAGS}"
      # shellcheck disable=SC2086
      openldap-cli ppolicy set "${NAME}" ${FLAGS}
      i=$((i + 1))
    done
    LOG "ppolicy sync done"

  # ---------------------------------------------------------------------------
  # users.sh - reconciles users under ou=users, or under `users[].ou`.
  #   * create-or-update every user in values.users
  #   * store generated passwords in per-user Secrets (kubernetes backend)
  #   * on removal from values.users, either delete or lock based on
  #     onUserRemove
  # ---------------------------------------------------------------------------
  users.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap

    # Every verb here but `user add` resolves its target with a subtree search
    # from LDAP_USER_OU. Clearing it starts that search at the base DN, so a
    # user declared with its own `ou:` is found wherever it lives - including
    # in the drift branch, which only knows a uid. `user add` is handed the
    # entry's own container back, one call at a time.
    export LDAP_USER_OU=""

    # A move re-points the olcAccess rules naming the old DN and the `member`
    # values in every group; both are decided from cn=config. Loaded only for
    # `move`, so the other modes keep the plain admin bind - and a release whose
    # admin Secret carries no config password keeps working.
    if [ "$ON_OU_CHANGE" = "move" ]; then
      load_config_bind
    fi

    [ -f /spec/users.json ] || { LOG "no users to reconcile"; }
    COUNT=$(jq 'length' /spec/users.json 2>/dev/null || echo 0)
    LOG "reconciling ${COUNT} user(s)"

    # Check every distinct target container up front: a missing OU should fail
    # the Job before half the users have been created.
    jq -r '[.[] | (.ou // "")] | unique[]' /spec/users.json 2>/dev/null > /tmp/user-ous.txt || true
    while read -r ou; do
      ensure_ou "$(normalize_ou "${ou:-$DEFAULT_USER_OU}")"
    done < /tmp/user-ous.txt

    # Track which uids we own (from values) - used later for drift cleanup.
    DECLARED=/tmp/declared-users.txt
    : > "$DECLARED"

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      UID_VAL=$(jq -r ".[$i].uid" /spec/users.json)
      [ -n "$UID_VAL" ] && [ "$UID_VAL" != "null" ] || DIE "user #$i has no uid"
      echo "$UID_VAL" >> "$DECLARED"

      GIVEN=$(jq -r ".[$i].givenName // empty" /spec/users.json)
      SN=$(jq -r ".[$i].sn // empty" /spec/users.json)
      MAIL=$(jq -r ".[$i].mail // empty" /spec/users.json)
      DISPLAY=$(jq -r ".[$i].displayName // empty" /spec/users.json)
      POLICY=$(jq -r ".[$i].policy // empty" /spec/users.json)
      EXISTING_SECRET=$(jq -r ".[$i].existingSecret // empty" /spec/users.json)
      OU=$(jq -r ".[$i].ou // empty" /spec/users.json)
      USER_OU=$(normalize_ou "${OU:-$DEFAULT_USER_OU}")

      # Extra attrs to pass as repeated `--set k=v`.
      EXTRA_KV=$(jq -r --argjson i "$i" '
        (.[$i].attrs // {}) | to_entries[] | (.key + "=" + (.value | tostring))
      ' /spec/users.json 2>/dev/null || true)

      if openldap-cli user info "$UID_VAL" >/dev/null 2>&1; then
        LOG "user ${UID_VAL}: exists - reconciling attributes"
        # The entry may not be where values now say it should be - a changed
        # `ou:`, or a hand move. `onOuChange` decides.
        CURRENT_DN=$(user_dn "$UID_VAL")
        case "$CURRENT_DN" in
          *",${USER_OU},${LDAP_BASE_DN}"|"") : ;;
          *)
            case "$ON_OU_CHANGE" in
              fail)
                DIE "user ${UID_VAL} is at ${CURRENT_DN}, values ask for ${USER_OU},${LDAP_BASE_DN} - set onOuChange=move to relocate it, or fix values"
                ;;
              move)
                LOG "  moving ${CURRENT_DN} -> ${USER_OU},${LDAP_BASE_DN}"
                # `user move` is a modrdn keeping the RDN, so the entry keeps
                # its entryUUID, its password hash and its operational
                # attributes - the per-user Secret and its pwd-changed-time
                # marker stay valid. It then re-points the olcAccess rules
                # naming the old DN and the group `member` values, neither of
                # which slapd rewrites on its own.
                openldap-cli user move "$UID_VAL" "${USER_OU},${LDAP_BASE_DN}"
                ;;
              *)
                LOG "  WARNING: entry is at ${CURRENT_DN}, values ask for ${USER_OU},${LDAP_BASE_DN}"
                LOG "  -> reconciling it where it stands; set onOuChange=move to relocate it"
                ;;
            esac
            ;;
        esac
        [ -n "$GIVEN" ]   && openldap-cli user set "$UID_VAL" givenName "$GIVEN"
        [ -n "$SN" ]      && openldap-cli user set "$UID_VAL" sn "$SN"
        [ -n "$MAIL" ]    && openldap-cli user set "$UID_VAL" mail "$MAIL"
        [ -n "$DISPLAY" ] && openldap-cli user set "$UID_VAL" displayName "$DISPLAY"
        for kv in $EXTRA_KV; do
          K=${kv%%=*}; V=${kv#*=}
          openldap-cli user set "$UID_VAL" "$K" "$V"
        done
      else
        LOG "user ${UID_VAL}: creating in ${USER_OU},${LDAP_BASE_DN}"
        # Determine password source.
        if [ -n "$EXISTING_SECRET" ]; then
          PW=$(kubectl -n "${RELEASE_NAMESPACE}" get secret "$EXISTING_SECRET" \
                 -o jsonpath='{.data.password}' | base64 -d)
          [ -n "$PW" ] || DIE "existingSecret ${EXISTING_SECRET} has no data.password"
        elif secret_password_exists "$UID_VAL"; then
          # The Secret outlived its directory entry. Its value may be a
          # bootstrap password the user already replaced through SSP - nothing
          # writes back to the Secret, so it cannot be told apart from one that
          # was never used. Default to a fresh password rather than handing back
          # a credential the user deliberately changed.
          if [ "${REUSE_ORPHANED_SECRET:-false}" = "true" ]; then
            LOG "user ${UID_VAL}: reusing the password from the surviving Secret"
            PW=$(secret_password_get "$UID_VAL")
          else
            LOG "user ${UID_VAL}: a Secret survives but the directory entry does not"
            LOG "  -> generating a NEW password and overwriting that Secret"
            LOG "  -> set reuseOrphanedUserSecret=true to keep the stored one"
            PW=$(gen_password)
          fi
        else
          PW=$(gen_password)
        fi

        # Build `--set k=v` pairs - repeated flag, space-separated args.
        # --password puts the secret on the command line, where any process in
        # the pod can read it from /proc/<pid>/cmdline; --password-stdin (CLI
        # v2026.9.1+) pipes it instead.
        if [ "${PASSWORD_FILES:-false}" = "true" ]; then
          set -- "$UID_VAL" --password-stdin
        else
          set -- "$UID_VAL" --password "$PW"
        fi
        [ -n "$GIVEN" ]   && set -- "$@" --set "givenName=$GIVEN"
        [ -n "$SN" ]      && set -- "$@" --set "sn=$SN"
        [ -n "$MAIL" ]    && set -- "$@" --set "mail=$MAIL"
        [ -n "$DISPLAY" ] && set -- "$@" --set "displayName=$DISPLAY"
        for kv in $EXTRA_KV; do
          set -- "$@" --set "$kv"
        done
        # `user add` is the one verb that BUILDS the DN from LDAP_USER_OU,
        # so this is where the entry's own container has to be in scope.
        if [ "${PASSWORD_FILES:-false}" = "true" ]; then
          printf '%s' "$PW" | ldap_in "$USER_OU" "$DEFAULT_GROUP_OU" openldap-cli user add "$@"
        else
          ldap_in "$USER_OU" "$DEFAULT_GROUP_OU" openldap-cli user add "$@"
        fi

        # Persist password ONLY when the chart owns it (no existingSecret).
        if [ -z "$EXISTING_SECRET" ]; then
          secret_password_put "$UID_VAL" "$PW"
        fi
      fi

      if [ -n "$POLICY" ]; then
        LOG "user ${UID_VAL}: ppolicy assign ${POLICY}"
        openldap-cli ppolicy assign "$UID_VAL" "$POLICY"
      fi

      i=$((i + 1))
    done

    # Drift: any user with the label openldap.platform/release=${RELEASE_NAME}
    # (i.e. previously created by this chart) that is no longer declared →
    # delete or lock per onUserRemove.
    LOG "checking drift - onUserRemove=${ON_USER_REMOVE}"
    KNOWN=$(kubectl -n "${RELEASE_NAMESPACE}" get secrets \
              -l "openldap.platform/release=${RELEASE_NAME},app.kubernetes.io/component=user-credentials" \
              -o jsonpath='{range .items[*]}{.metadata.labels.openldap\.platform/user}{"\n"}{end}' \
              2>/dev/null | sort -u)
    for uid in $KNOWN; do
      if ! grep -Fxq "$uid" "$DECLARED"; then
        case "$ON_USER_REMOVE" in
          delete)
            LOG "drift: deleting user ${uid} + its Secret"
            openldap-cli user delete "$uid" || true
            secret_password_delete "$uid"
            ;;
          lock)
            LOG "drift: locking user ${uid} (pwdAccountLockedTime)"
            openldap-cli user set "$uid" pwdAccountLockedTime 000001010000Z || true
            ;;
          *)
            DIE "onUserRemove=${ON_USER_REMOVE}: expected delete|lock"
            ;;
        esac
      fi
    done
    LOG "users sync done"

  # ---------------------------------------------------------------------------
  # groups.sh - reconciles groupOfNames entries under ou=groups, or under
  # `groups[].ou`.
  # ---------------------------------------------------------------------------
  groups.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap

    # Members are resolved by searching from the base DN, so a group can hold
    # users that live in different OUs. Group lookups stay scoped to the OU the
    # values declare (gcli below) - widening them would let an unrelated
    # groupOfNames with the same cn elsewhere in the tree hijack the reconcile.
    export LDAP_USER_OU=""

    gcli() { ldap_in "" "$GROUP_OU" openldap-cli "$@"; }

    # Same as users.sh: the config bind is only needed to repair the olcAccess
    # rules a move would otherwise leave naming a DN that no longer exists.
    if [ "$ON_OU_CHANGE" = "move" ]; then
      load_config_bind
    fi

    [ -f /spec/groups.json ] || { LOG "no groups to reconcile"; exit 0; }
    COUNT=$(jq 'length' /spec/groups.json)
    LOG "reconciling ${COUNT} group(s)"

    # Distinct target containers - checked up front, then reused as the exact
    # set of OUs the drift pass is allowed to look into.
    MANAGED_OUS=/tmp/group-ous.txt
    jq -r '[.[] | (.ou // "")] | unique[]' /spec/groups.json 2>/dev/null > /tmp/group-ous.raw || true
    : > "$MANAGED_OUS"
    while read -r ou; do
      ou=$(normalize_ou "${ou:-$DEFAULT_GROUP_OU}")
      ensure_ou "$ou"
      echo "$ou" >> "$MANAGED_OUS"
    done < /tmp/group-ous.raw

    DECLARED=/tmp/declared-groups.txt
    : > "$DECLARED"

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      CN=$(jq -r ".[$i].cn" /spec/groups.json)
      [ -n "$CN" ] && [ "$CN" != "null" ] || DIE "group #$i has no cn"
      echo "$CN" >> "$DECLARED"

      MEMBERS=$(jq -r ".[$i].members[]?" /spec/groups.json)
      [ -n "$MEMBERS" ] || DIE "group ${CN} has no members (groupOfNames requires ≥ 1)"

      DESC=$(jq -r ".[$i].description // empty" /spec/groups.json)
      OU=$(jq -r ".[$i].ou // empty" /spec/groups.json)
      GROUP_OU=$(normalize_ou "${OU:-$DEFAULT_GROUP_OU}")

      # The group may already exist somewhere else in the tree. Creating a
      # second groupOfNames with the same cn would make every later lookup
      # ambiguous, so this is settled before anything is created: `onOuChange`
      # says whether to move it, leave it where it is, or stop.
      EXISTING_DN=$(ldap_in "" "" openldap-cli group info "$CN" -o json 2>/dev/null \
        | jq -r '.dn // empty' 2>/dev/null || true)
      case "${EXISTING_DN:-}" in
        ""|*",${GROUP_OU},${LDAP_BASE_DN}") : ;;
        *)
          case "$ON_OU_CHANGE" in
            fail)
              DIE "group ${CN} is at ${EXISTING_DN}, values place it in ${GROUP_OU},${LDAP_BASE_DN} - set onOuChange=move to relocate it, or fix values"
              ;;
            move)
              # No `group move` in the CLI, so the generic modrdn: same RDN,
              # new superior. It re-points the olcAccess rules naming the old
              # DN. It does NOT repair a `member` value pointing at this group
              # (a nested group) - the chart never creates those, but an
              # out-of-band one would need the refint overlay or a hand fix.
              if ! RDN=$(dn_rdn "$EXISTING_DN"); then
                DIE "group ${CN} is at ${EXISTING_DN} and its RDN carries an escaped separator - move it by hand, or fix values"
              fi
              LOG "group ${CN}: moving ${EXISTING_DN} -> ${GROUP_OU},${LDAP_BASE_DN}"
              openldap-cli entry rename "$EXISTING_DN" "$RDN" \
                --newsuperior "${GROUP_OU},${LDAP_BASE_DN}"
              ;;
            *)
              # Reconcile it where it stands: pointing gcli at the declared OU
              # would miss it and create a duplicate cn one OU over.
              if ! ACTUAL_OU=$(dn_parent_ou "$EXISTING_DN"); then
                DIE "group ${CN} is at ${EXISTING_DN} and its RDN carries an escaped separator - move it by hand, or fix values"
              fi
              LOG "group ${CN}: WARNING - entry is at ${EXISTING_DN}, values place it in ${GROUP_OU},${LDAP_BASE_DN}"
              LOG "  -> reconciling it where it stands; set onOuChange=move to relocate it"
              GROUP_OU="$ACTUAL_OU"
              ;;
          esac
          ;;
      esac

      if gcli group info "$CN" >/dev/null 2>&1; then
        LOG "group ${CN}: exists - reconciling members"

        # Compared as full DNs, never as RDNs. Reducing `member` to its RDN
        # (the old `sed -n 's/^cn=\([^,]*\),.*/\1/p'`) made a stale value
        # indistinguishable from a correct one: an entry moved out of ou=users
        # by hand leaves `cn=vpn,ou=users,...` behind, which reduces to `vpn`,
        # matches the declared member `vpn`, and is never repaired - and
        # without the refint overlay nothing else repairs it either.
        : > /tmp/members-want.txt
        for u in $MEMBERS; do
          DN=$(user_dn "$u")
          [ -n "$DN" ] || DIE "group ${CN}: declared member ${u} has no entry in the directory"
          echo "$DN" >> /tmp/members-want.txt
        done
        sort -u /tmp/members-want.txt -o /tmp/members-want.txt

        gcli group info "$CN" -o json 2>/dev/null \
          | jq -r '.attrs.member[]? // empty' \
          | sort -u > /tmp/members-have.txt

        # Plain files, not `comm <(...) <(...)`: the Jobs run /bin/sh, which is
        # busybox ash on the alpine image, and it has no process substitution -
        # the script died with `Syntax error: "(" unexpected` before reaching
        # the first membership change.
        if ! cmp -s /tmp/members-want.txt /tmp/members-have.txt; then
          comm -23 /tmp/members-want.txt /tmp/members-have.txt \
            | while read -r dn; do [ -n "$dn" ] && LOG "  + ${dn}"; done
          comm -13 /tmp/members-want.txt /tmp/members-have.txt \
            | while read -r dn; do [ -n "$dn" ] && LOG "  - ${dn}"; done
          # One atomic replace rather than add-member/remove-member pairs:
          # groupOfNames rejects an empty `member`, so a full swap done in two
          # steps has to be ordered by hand and still breaks when the last
          # member is the one being replaced. `--force` is required because a
          # replace drops the values it was not shown - which is the point.
          set -- "$CN" member
          while read -r dn; do
            [ -n "$dn" ] || continue
            set -- "$@" "$dn"
          done < /tmp/members-want.txt
          gcli group set --force "$@"
        fi
      else
        LOG "group ${CN}: creating in ${GROUP_OU},${LDAP_BASE_DN} with ${MEMBERS}"
        # `group create` requires at least one --member; extra members added after.
        FIRST=$(printf '%s\n' $MEMBERS | head -n 1)
        REST=$(printf '%s\n' $MEMBERS | tail -n +2)
        # `group create` is the one verb that BUILDS the DN from
        # LDAP_GROUP_OU, so the entry's own container has to be in scope.
        gcli group create "$CN" --member "$FIRST"
        for u in $REST; do
          gcli group add-member "$CN" "$u"
        done
      fi

      # Description reconcile (CLI ≥ v2026.7.4).
      if [ -n "$DESC" ]; then
        CURRENT_DESC=$(gcli group info "$CN" -o json 2>/dev/null \
          | jq -r '.attrs.description[0]? // empty')
        if [ "$CURRENT_DESC" != "$DESC" ]; then
          LOG "  set description=${DESC}"
          gcli group set "$CN" description "$DESC"
        fi
      fi

      i=$((i + 1))
    done

    LOG "checking drift - onGroupRemove=${ON_GROUP_REMOVE}"
    # Scoped to the OUs values declare, never the whole tree: a groupOfNames
    # sitting in an OU no entry mentions is somebody else's and must survive.
    # groups list text form: one CN per line, plus a trailing "(N groups)" tally.
    # Each line is "<ou> <cn>" so the removal runs in the container the group
    # was found in. Nested containers can list the same group twice; `sort -u`
    # on the pair keeps one line per (ou, cn).
    KNOWN=/tmp/known-groups.txt
    : > "$KNOWN"
    while read -r ou; do
      [ -n "$ou" ] || continue
      ldap_in "" "$ou" openldap-cli groups list 2>/dev/null \
        | grep -v '^(' | grep -v '^$' \
        | sed "s|^|${ou} |" >> "$KNOWN" || true
    done < "$MANAGED_OUS"
    sort -u "$KNOWN" -o "$KNOWN"

    while read -r ou cn; do
      [ -n "${cn:-}" ] || continue
      if ! grep -Fxq "$cn" "$DECLARED"; then
        case "$ON_GROUP_REMOVE" in
          delete)
            LOG "drift: deleting group ${cn} from ${ou},${LDAP_BASE_DN}"
            ldap_in "" "$ou" openldap-cli group delete "$cn" || true
            ;;
          keep) : ;;
          *) DIE "onGroupRemove=${ON_GROUP_REMOVE}: expected delete|keep" ;;
        esac
      fi
    done < "$KNOWN"
    LOG "groups sync done"

  # ---------------------------------------------------------------------------
  # backup.sh - dump the data + config databases to /backup as gzipped LDIF.
  #   * File names follow the values `backup.fileNamePattern` (already resolved
  #     into KIND_FILENAME / DATA_FILENAME env vars by the CronJob spec).
  #   * Retention: after a successful dump, prune files older than
  #     ${RETENTION_DAYS} in /backup.
  # ---------------------------------------------------------------------------
  backup.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap

    : "${DATA_FILENAME:?}"; : "${CONFIG_FILENAME:?}"; : "${RETENTION_DAYS:?}"
    DATA_ARGS=""
    [ "${INCLUDE_OPERATIONAL:-true}" = "true" ] && DATA_ARGS="--operational"

    mkdir -p /backup
    LOG "backup data -> /backup/${DATA_FILENAME}"
    # shellcheck disable=SC2086
    openldap-cli backup data /backup/"${DATA_FILENAME}" $DATA_ARGS

    LOG "backup config -> /backup/${CONFIG_FILENAME}"
    # config backup requires the cn=config admin - inject its creds temporarily.
    load_config_bind
    openldap-cli backup config /backup/"${CONFIG_FILENAME}"

    LOG "pruning /backup for files older than ${RETENTION_DAYS} days"
    find /backup -type f \
      \( -name '*.ldif.gz' -o -name '*.ldif' -o -name '*.tar.gz' \) \
      -mtime "+${RETENTION_DAYS}" -delete -print
    LOG "backup done"

  # ---------------------------------------------------------------------------
  # accesslog-purge.sh - reclaim cn=accesslog MDB space.
  #   `--sweep DD+HH:MM`  drives how often + how deep slapd purges.
  #   `--keep-days N`     minimum retention.
  #   `--dry-run`         no writes, only report what would be deleted.
  # ---------------------------------------------------------------------------
  accesslog-purge.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap

    : "${KEEP_DAYS:?}"; : "${SWEEP:?}"
    ARGS="--keep-days ${KEEP_DAYS} --sweep ${SWEEP}"
    [ "${DRY_RUN:-false}" = "true" ] && ARGS="${ARGS} --dry-run"

    # The purge writes cn=config; use the config-admin credentials.
    load_config_bind

    LOG "ops accesslog-purge ${ARGS}"
    # shellcheck disable=SC2086
    openldap-cli ops accesslog-purge ${ARGS}
    LOG "accesslog purge done"

  # ---------------------------------------------------------------------------
  # overlays.sh - reconciles overlays via `openldap-cli config overlay
  # enable|disable`. Runs BEFORE ppolicy/users/groups so overlays enabled here
  # (memberof, refint, ppolicy, …) are available when those jobs run.
  # State is tracked in ConfigMap ${RELEASE}-openldap-sync-state key `overlays`.
  # ---------------------------------------------------------------------------
  overlays.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap
    load_config_bind

    [ -f /spec/overlays.json ] || { LOG "no overlays to reconcile"; exit 0; }
    COUNT=$(jq 'length' /spec/overlays.json)
    LOG "reconciling ${COUNT} overlay(s)"

    PREV=/tmp/prev-overlays.json
    state_get overlays > "$PREV"

    DECLARED=/tmp/declared-overlays.json
    jq -c '[.[] | {name: .name, database: (.database // "")}]' /spec/overlays.json > "$DECLARED"

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      NAME=$(jq -r ".[$i].name" /spec/overlays.json)
      [ -n "$NAME" ] && [ "$NAME" != "null" ] || DIE "overlay #$i has no name"
      ENABLE=$(jq -r ".[$i].enable // true" /spec/overlays.json)
      DB=$(jq -r ".[$i].database // empty" /spec/overlays.json)
      PURGE=$(jq -r ".[$i].purge // false" /spec/overlays.json)
      NO_MOD=$(jq -r ".[$i].noModule // false" /spec/overlays.json)

      DB_ARG=""
      [ -n "$DB" ] && DB_ARG="--db ${DB}"

      if [ "$ENABLE" = "true" ]; then
        FLAGS=""
        [ "$NO_MOD" = "true" ] && FLAGS="--no-module"
        LOG "overlay enable ${NAME} ${DB_ARG} ${FLAGS}"
        # shellcheck disable=SC2086
        openldap-cli config overlay enable "$NAME" $DB_ARG $FLAGS
      else
        FLAGS=""
        [ "$PURGE" = "true" ] && FLAGS="--purge"
        LOG "overlay disable ${NAME} ${DB_ARG} ${FLAGS}"
        # shellcheck disable=SC2086
        openldap-cli config overlay disable "$NAME" $DB_ARG $FLAGS
      fi

      i=$((i + 1))
    done

    # Drift: overlays previously enabled by the chart but no longer declared
    # are DISABLED (never purged automatically - data loss risk).
    LOG "checking drift for removed overlays"
    REMOVED=$(jq -c --slurpfile decl "$DECLARED" \
      '[.[] as $p | $decl[0] | map(.name == $p.name and .database == $p.database) | any | not | select(.) | $p]' \
      "$PREV" || echo '[]')
    echo "$REMOVED" | jq -c '.[]?' | while read -r item; do
      RN=$(printf '%s' "$item" | jq -r .name)
      RDB=$(printf '%s' "$item" | jq -r '.database // empty')
      DB_ARG=""
      [ -n "$RDB" ] && DB_ARG="--db ${RDB}"
      LOG "drift: disabling overlay ${RN} ${DB_ARG}"
      # shellcheck disable=SC2086
      openldap-cli config overlay disable "$RN" $DB_ARG || true
    done

    state_put overlays "$DECLARED"
    LOG "overlays sync done"

  # ---------------------------------------------------------------------------
  # acls.sh - reconciles declarative olcAccess clauses via `openldap-cli config
  # acl grant/revoke`. Each entry owns ONE grantee (group|dn); reconcile always
  # revokes-then-grants so the resulting rule matches the declared shape.
  # State (grantees × databases) tracked in ConfigMap key `acls`.
  # ---------------------------------------------------------------------------
  acls.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap
    load_config_bind

    [ -f /spec/acls.json ] || { LOG "no ACLs to reconcile"; exit 0; }
    COUNT=$(jq 'length' /spec/acls.json)
    LOG "reconciling ${COUNT} ACL clause(s)"

    DEFAULT_DB="olcDatabase={1}mdb,cn=config"

    PREV=/tmp/prev-acls.json
    state_get acls > "$PREV"

    # Declared identity = (database, grantee-kind, grantee-name).
    DECLARED=/tmp/declared-acls.json
    jq -c --arg ddb "$DEFAULT_DB" '[.[] | {
      name: .name,
      database: (.database // $ddb),
      kind: (if .group then "group" else "dn" end),
      grantee: (.group // .dn)
    }]' /spec/acls.json > "$DECLARED"

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      NAME=$(jq -r ".[$i].name" /spec/acls.json)
      [ -n "$NAME" ] && [ "$NAME" != "null" ] || DIE "acl #$i has no name"
      TARGET=$(jq -r ".[$i].target" /spec/acls.json)
      [ -n "$TARGET" ] && [ "$TARGET" != "null" ] || DIE "acl ${NAME}: target required"
      ACCESS=$(jq -r ".[$i].access" /spec/acls.json)
      [ "$ACCESS" = "read" ] || [ "$ACCESS" = "write" ] || DIE "acl ${NAME}: access must be read|write"
      GROUP=$(jq -r ".[$i].group // empty" /spec/acls.json)
      DN=$(jq -r ".[$i].dn // empty" /spec/acls.json)
      [ -n "$GROUP" ] || [ -n "$DN" ] || DIE "acl ${NAME}: group or dn required"
      [ -n "$GROUP" ] && [ -n "$DN" ] && DIE "acl ${NAME}: group and dn are mutually exclusive"
      DB=$(jq -r --arg d "$DEFAULT_DB" ".[$i].database // \$d" /spec/acls.json)
      SCOPE=$(jq -r ".[$i].scope // empty" /spec/acls.json)
      FILTER=$(jq -r ".[$i].filter // empty" /spec/acls.json)
      AT=$(jq -r ".[$i].at // empty" /spec/acls.json)
      TERM=$(jq -r ".[$i].terminator // empty" /spec/acls.json)

      # 1) revoke every existing clause referencing the grantee (idempotent).
      if [ -n "$GROUP" ]; then
        LOG "acl ${NAME}: revoke group=${GROUP} on ${DB}"
        openldap-cli config acl revoke "$DB" --group "$GROUP" || true
      else
        LOG "acl ${NAME}: revoke dn=${DN} on ${DB}"
        openldap-cli config acl revoke "$DB" --dn "$DN" || true
      fi

      # 2) grant fresh.
      set -- "$DB" "$TARGET" --access "$ACCESS"
      [ -n "$GROUP" ]  && set -- "$@" --group "$GROUP"
      [ -n "$DN" ]     && set -- "$@" --dn "$DN"
      [ -n "$SCOPE" ]  && set -- "$@" --scope "$SCOPE"
      [ -n "$FILTER" ] && set -- "$@" --filter "$FILTER"
      [ -n "$AT" ]     && set -- "$@" --at "$AT"
      [ -n "$TERM" ]   && set -- "$@" --terminator "$TERM"
      LOG "acl ${NAME}: grant target=${TARGET} access=${ACCESS}"
      openldap-cli config acl grant "$@"

      i=$((i + 1))
    done

    # Drift: revoke grantees the chart owned but that are no longer declared.
    LOG "checking drift for removed ACL grantees"
    REMOVED=$(jq -c --slurpfile decl "$DECLARED" '
      [.[] as $p | ($decl[0] | map(.database == $p.database and .kind == $p.kind and .grantee == $p.grantee) | any) as $found
        | if $found then empty else $p end]
    ' "$PREV" || echo '[]')
    echo "$REMOVED" | jq -c '.[]?' | while read -r item; do
      RDB=$(printf '%s' "$item" | jq -r .database)
      RK=$(printf '%s' "$item" | jq -r .kind)
      RG=$(printf '%s' "$item" | jq -r .grantee)
      LOG "drift: revoke ${RK}=${RG} on ${RDB}"
      openldap-cli config acl revoke "$RDB" --"$RK" "$RG" || true
    done

    state_put acls "$DECLARED"
    LOG "acls sync done"

  # ---------------------------------------------------------------------------
  # tree-grants.sh - reconciles svc grants (container + entry rules).
  # Identity = (name, tree). Removed entries are revoked with --tree so
  # co-grantees keep their rules.
  # ---------------------------------------------------------------------------
  tree-grants.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap
    load_config_bind

    [ -f /spec/tree-grants.json ] || { LOG "no tree grants to reconcile"; exit 0; }
    COUNT=$(jq 'length' /spec/tree-grants.json)
    LOG "reconciling ${COUNT} tree grant(s)"

    PREV=/tmp/prev-tree-grants.json
    state_get tree-grants > "$PREV"

    DECLARED=/tmp/declared-tree-grants.json
    jq -c '[.[] | {name: .name, tree: .tree}]' /spec/tree-grants.json > "$DECLARED"

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      NAME=$(jq -r ".[$i].name" /spec/tree-grants.json)
      [ -n "$NAME" ] && [ "$NAME" != "null" ] || DIE "tree grant #$i has no name"
      TREE=$(jq -r ".[$i].tree" /spec/tree-grants.json)
      [ -n "$TREE" ] && [ "$TREE" != "null" ] || DIE "tree grant ${NAME}: tree required"
      ACCESS=$(jq -r ".[$i].access // \"read\"" /spec/tree-grants.json)

      # revoke existing rules for (name, tree) then re-grant.
      LOG "svc revoke ${NAME} --tree ${TREE}"
      openldap-cli svc revoke "$NAME" --tree "$TREE" || true

      # membersOf: accept a single group (string) or several (list) and emit
      # one --members-of per group. Repeatable since openldap-cli v2026.7.5;
      # multiple groups are OR'd (member of ANY satisfies the rule). Values may
      # be group names or DNs, so read line-by-line (never split on ',' / ' ').
      # A file + `< file` redirect (not a pipe) keeps the while loop in this
      # shell so the accumulated "$@" survives.
      jq -r ".[$i].membersOf | if type==\"array\" then .[] elif .==null then empty else . end" \
        /spec/tree-grants.json > /tmp/tg-mems.txt
      set -- "$NAME" --tree "$TREE" --access "$ACCESS"
      MEMCNT=0
      while IFS= read -r g; do
        [ -n "$g" ] || continue
        set -- "$@" --members-of "$g"
        MEMCNT=$((MEMCNT + 1))
      done < /tmp/tg-mems.txt
      LOG "svc grant ${NAME} --tree ${TREE} --access ${ACCESS} (members-of groups: ${MEMCNT})"
      openldap-cli svc grant "$@"

      i=$((i + 1))
    done

    LOG "checking drift for removed tree grants"
    REMOVED=$(jq -c --slurpfile decl "$DECLARED" '
      [.[] as $p | ($decl[0] | map(.name == $p.name and .tree == $p.tree) | any) as $found
        | if $found then empty else $p end]
    ' "$PREV" || echo '[]')
    echo "$REMOVED" | jq -c '.[]?' | while read -r item; do
      RN=$(printf '%s' "$item" | jq -r .name)
      RT=$(printf '%s' "$item" | jq -r .tree)
      LOG "drift: svc revoke ${RN} --tree ${RT}"
      openldap-cli svc revoke "$RN" --tree "$RT" || true
    done

    state_put tree-grants "$DECLARED"
    LOG "tree grants sync done"

  # ---------------------------------------------------------------------------
  # acl-lint.sh - periodic `config acl lint`. Exits non-zero when unreachable /
  # no-op rules are reported so the CronJob shows Failed and can page.
  # ---------------------------------------------------------------------------
  stale-user-secrets.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap

    # A Secret only carries a uid, and `users[].ou` means the entry behind it
    # may sit outside ou=users - resolve from the base DN.
    export LDAP_USER_OU=""

    # A chart-managed user Secret holds the password the chart generated at
    # creation time. Nothing writes back to it: when the user changes their
    # password (Self Service Password binds as the ssp account and modifies the
    # entry directly) the Secret keeps the old value, and it cannot be repaired
    # - the directory only stores a hash. So the Secret is not stale data to be
    # refreshed, it is a spent credential to be removed.
    #
    # Detection compares the directory's current pwdChangedTime against the one
    # recorded on the Secret when the chart wrote it. Anything else is left
    # alone: a missing marker (Secret written before this job existed), a
    # missing pwdChangedTime (entry seeded by slapadd, never written over LDAP),
    # or a missing entry (that is the users sync job's drift branch, not ours).
    LOG "scanning chart-managed user Secrets - dryRun=${DRY_RUN:-false}"

    SECRETS=$(kubectl -n "${RELEASE_NAMESPACE}" get secrets \
                -l "openldap.platform/release=${RELEASE_NAME},app.kubernetes.io/component=user-credentials" \
                -o jsonpath='{range .items[*]}{.metadata.labels.openldap\.platform/user}{" "}{.metadata.annotations.openldap\.platform/pwd-changed-time}{"\n"}{end}' \
                2>/dev/null || true)

    CHECKED=0; STALE=0; SKIPPED=0
    printf '%s\n' "$SECRETS" | while IFS=' ' read -r UID_VAL STAMP; do
      [ -n "${UID_VAL:-}" ] || continue
      CHECKED=$((CHECKED + 1))

      if ! openldap-cli user info "$UID_VAL" >/dev/null 2>&1; then
        LOG "  ${UID_VAL}: no directory entry - left to the users sync job"
        SKIPPED=$((SKIPPED + 1)); continue
      fi
      if [ -z "${STAMP:-}" ]; then
        LOG "  ${UID_VAL}: Secret carries no pwd-changed-time marker - skipping"
        SKIPPED=$((SKIPPED + 1)); continue
      fi

      CURRENT=$(user_pwd_changed_time "$UID_VAL")
      if [ -z "${CURRENT:-}" ]; then
        LOG "  ${UID_VAL}: entry has no pwdChangedTime - skipping"
        SKIPPED=$((SKIPPED + 1)); continue
      fi
      if [ "$CURRENT" = "$STAMP" ]; then
        LOG "  ${UID_VAL}: password unchanged since the chart set it - Secret still valid"
        continue
      fi

      STALE=$((STALE + 1))
      if [ "${DRY_RUN:-false}" = "true" ]; then
        LOG "  ${UID_VAL}: STALE (was ${STAMP}, now ${CURRENT}) - would delete its Secret"
      else
        LOG "  ${UID_VAL}: STALE (was ${STAMP}, now ${CURRENT}) - deleting its Secret"
        secret_password_delete "$UID_VAL"
      fi
    done

    LOG "stale user Secret scan done"

  # ---------------------------------------------------------------------------
  # migrate-dump.sh - pre-upgrade half of the 2.6 -> 2.7 dump and reload.
  #
  # Runs while the OLD server is still serving. It decides for itself whether
  # there is anything to do: the running major comes off cn=Monitor, and a
  # release that is not changing major exits without touching anything.
  #
  # Failing here fails the helm upgrade, which is the point - the data is only
  # rebuilt once a dump exists.
  # ---------------------------------------------------------------------------
  tls-check.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh

    : "${CHECK_DAYS:?}"

    # Not wait_for_ldap: that binds, and a bind needs the CA in the container's
    # trust store while this probe deliberately needs nothing. `tls show` is a
    # handshake and nothing more - the exact readiness signal for this Job.
    wait_for_tls() {
      end=$(( $(date +%s) + ${WAIT_TIMEOUT_SECONDS:-180} ))
      while [ "$(date +%s)" -lt "$end" ]; do
        if openldap-cli tls show >/dev/null 2>&1; then
          LOG "TLS endpoint reachable at ${LDAP_URL}"
          return 0
        fi
        sleep "${WAIT_INTERVAL_SECONDS:-3}"
      done
      DIE "no TLS handshake with ${LDAP_URL} within ${WAIT_TIMEOUT_SECONDS:-180}s"
    }
    wait_for_tls

    # Non-zero here means "found something", which is the normal case - so the
    # exit code is deliberately ignored and the JSON is what gets read. A run
    # that produced no JSON at all is a different failure and stops the Job.
    OUT=$(openldap-cli tls check --days "${CHECK_DAYS}" -o json 2>/tmp/tls-check.err || true)
    if ! printf '%s' "$OUT" | jq -e . >/dev/null 2>&1; then
      LOG "tls check produced no result:"
      cat /tmp/tls-check.err >&2 || true
      DIE "tls check failed to probe ${LDAP_URL}"
    fi

    LOG "chain on ${LDAP_URL}:"
    printf '%s' "$OUT" | jq -r '.chain[]
      | "  \(.role): \(.subject) - \(.days_left) day(s) left, until \(.not_after)"'
    LOG "protocols accepted: $(printf '%s' "$OUT" | jq -r '.protocols_accepted | join(", ")')"
    printf '%s' "$OUT" | jq -r '.notes[]? | "[sync]   ~ " + .'

    # Expiry and obsolete protocols come from the structured fields rather than
    # from the `problems` strings - the strings are prose and would be matched
    # by accident.
    EXPIRY=$(printf '%s' "$OUT" | jq -r --argjson d "${CHECK_DAYS}" '
      .chain[] | select(.expired or .days_left < $d)
      | "\(.role) (\(.subject)) " +
        (if .expired then "EXPIRED on \(.not_after)"
                     else "expires in \(.days_left) day(s), on \(.not_after)" end)')

    OBSOLETE=$(printf '%s' "$OUT" | jq -r '
      .protocols_accepted[] | select(. == "TLS 1.0" or . == "TLS 1.1")')

    # Whatever is left once those two are accounted for: the chain findings,
    # and anything the probe may report that this script does not know about.
    REMAINDER=$(printf '%s' "$OUT" | jq -r '
      .problems[]?
      | select(test("EXPIRED on|expires in") | not)
      | select(test("deprecated by RFC 8996") | not)')
    CHAIN=$(printf '%s\n' "$REMAINDER" \
      | grep -E "does not carry its root|does not validate" || true)
    OTHER=$(printf '%s\n' "$REMAINDER" \
      | grep -vE "does not carry its root|does not validate" || true)

    FAILED=0

    # $1 = findings, $2 = whether they fail the Job, $3 = label
    report() {
      [ -n "$(printf '%s' "$1" | tr -d '[:space:]')" ] || return 0
      if [ "$2" = "true" ]; then
        FAILED=1
        printf '%s\n' "$1" | while read -r f; do
          [ -n "$f" ] && LOG "  ! ${3}: ${f}"
        done
      else
        printf '%s\n' "$1" | while read -r f; do
          [ -n "$f" ] && LOG "  ~ ${3} (not failing, failOn disabled): ${f}"
        done
      fi
    }

    report "$EXPIRY"   "${FAIL_EXPIRY:-true}"    "expiry"
    report "$OBSOLETE" "${FAIL_PROTOCOLS:-true}" "server still accepts"
    report "$CHAIN"    "${FAIL_CHAIN:-false}"    "chain"
    # Never optional: a revoked staple or an unreadable OCSP response is not a
    # property of how the certificate was issued, it is a live problem.
    report "$OTHER"    "true"                    "finding"

    if [ "$FAILED" -eq 1 ]; then
      DIE "TLS audit found problems on ${LDAP_URL} - see above"
    fi
    LOG "TLS audit clean"

  acl-lint.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    wait_for_ldap
    load_config_bind

    : "${LINT_DATABASES:=olcDatabase={1}mdb,cn=config}"
    FAILED=0
    # LINT_DATABASES is a space-separated list; each entry may contain commas
    # (e.g. olcDatabase={1}mdb,cn=config) so caller must not use commas as sep.
    for DB in $LINT_DATABASES; do
      LOG "lint ${DB}"
      if ! openldap-cli config acl lint "$DB"; then
        LOG "  FINDINGS on ${DB}"
        FAILED=1
      fi
    done

    if [ "$FAILED" -eq 1 ]; then
      DIE "ACL lint reported unreachable or no-op rules - see logs"
    fi
    LOG "acl lint clean"
{{- end }}
