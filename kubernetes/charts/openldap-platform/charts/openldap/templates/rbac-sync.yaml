{{- /*
RBAC for the users / groups / ppolicy sync Jobs.

The sync Jobs need to:
  - create/update/read/delete Secrets in the release namespace (per-user
    passwords storage when secrets.backend=kubernetes);
  - list Secrets (for drift detection: find <release>-openldap-user-*
    Secrets whose user is no longer in values.users → clean them up
    alongside the LDAP entry).

Nothing outside the release namespace is granted; cluster-scoped access
is never needed (external-secrets integration delegates to ESO's own
controller SA rather than expanding this Role).
*/ -}}
{{- $needScaleWatcher := and (eq .Values.mode "multi-master") (or .Values.hpa.enabled .Values.scaleSchedule) -}}
{{- if or .Values.users .Values.groups .Values.policies .Values.acls .Values.treeGrants .Values.overlays .Values.backup.enabled .Values.accesslogPurgeJob.enabled .Values.aclLintCronJob.enabled .Values.scaleSchedule $needScaleWatcher (and .Values.tls.enabled (eq .Values.tls.backend "job")) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openldap.fullname" . }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openldap.fullname" . }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
rules:
  # Secrets stay namespace-wide, and that is forced by what the scripts do:
  #   * `create` and `list` take no resourceNames - `list` is how drift finds
  #     orphaned `<release>-openldap-user-*` Secrets, whose uids are by
  #     definition no longer in values and so cannot be enumerated here;
  #   * `get` must reach any name, because users may point `existingSecret` at
  #     an arbitrary Secret in the namespace.
  # `delete` is the one verb that can be dropped, and it is: only
  # onUserRemove=delete ever removes a Secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch{{ if eq .Values.onUserRemove "delete" }}, delete{{ end }}]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  {{- if or .Values.acls .Values.treeGrants .Values.overlays }}
  # State ConfigMap `<release>-openldap-sync-state` tracks acls / tree-grants /
  # overlays across upgrades so drift removal knows what was previously applied.
  # Exactly one object, with a name known at render time - so name it, rather
  # than handing the Jobs every ConfigMap in the namespace.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "openldap.fullname" . }}-sync-state]
    verbs: [get, create, patch]
  # `create` above is only authorized because a resourceNames rule cannot cover
  # it; the state ConfigMap does not exist on first install.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  {{- end }}
  {{- if or (and .Values.tls.enabled (eq .Values.tls.backend "job") .Values.tls.job.rollingRestartOnRenew) $needScaleWatcher }}
  # TLS renew CronJob triggers `kubectl rollout restart` on the STS; the
  # scale-watcher Deployment reads spec.replicas and patches on change. Both
  # address the StatefulSets by exact name, and neither lists or watches, so
  # scope to those names and drop the collection verbs.
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames:
      - {{ include "openldap.fullname" . }}
      {{- if gt (int .Values.readOnlyReplicas.count) 0 }}
      - {{ include "openldap.readonlyFullname" . }}
      {{- end }}
    verbs: [get, patch]
  {{- end }}
  {{- if and .Values.scaleSchedule .Values.hpa.enabled }}
  # scaleSchedule CronJobs adjust HPA min/max at scheduled times - one HPA,
  # named by the chart.
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [{{ include "openldap.fullname" . }}]
    verbs: [get, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openldap.fullname" . }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
subjects:
  - kind: ServiceAccount
    name: {{ include "openldap.fullname" . }}-sync
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openldap.fullname" . }}-sync
{{- end }}
