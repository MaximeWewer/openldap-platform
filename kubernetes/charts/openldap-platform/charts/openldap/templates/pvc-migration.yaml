{{- if and .Values.majorUpgrade.enabled (not .Values.majorUpgrade.persistence.existingClaim) -}}
{{- /*
Holds the LDIF dump taken before a major OpenLDAP upgrade rebuilds the data
directory. Kept on uninstall on purpose: it is the only copy of the tree
between the dump and a verified reload.

Created as a pre-upgrade hook so it exists before the dump Job that fills it,
with hook-succeeded deletion disabled - a hook resource is deleted after the
hook by default, which would take the dump with it.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openldap.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/resource-policy: keep
    # NOT a hook, deliberately.
    #
    # A hook PVC cannot carry state across a sync. Helm's
    # `hook-delete-policy: before-hook-creation` deletes it, and removing that
    # annotation does not help under ArgoCD, which applies its OWN default -
    # BeforeHookCreation - to any hook that does not say otherwise. So the
    # claim was deleted and recreated on every attempt, which both threw away
    # the only copy of the directory and deadlocked the sync: the claim cannot
    # go while a Job pod still references it, and the completed dump pod is
    # kept for its logs.
    #
    # As an ordinary resource it is created once, in the sync phase, and then
    # simply exists. The cost is an ordering requirement: `majorUpgrade.enabled`
    # has to be turned on in a sync BEFORE the one that moves `image.tag`
    # across the major, so the claim is already there when the pre-upgrade dump
    # Job needs to mount it. Enabling it costs nothing on its own - the dump Job
    # reads the running version and exits when the major has not changed.
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.majorUpgrade.persistence.size | quote }}
  {{- with .Values.majorUpgrade.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
