{{- if and .Values.majorUpgrade.enabled (not .Values.majorUpgrade.persistence.existingClaim) -}}
{{- /*
Holds the LDIF dump taken before a major OpenLDAP upgrade rebuilds the data
directory. Kept on uninstall on purpose: it is the only copy of the tree
between the dump and a verified reload.

Created as a pre-upgrade hook so it exists before the dump Job that fills it,
with hook-succeeded deletion disabled - a hook resource is deleted after the
hook by default, which would take the dump with it.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openldap.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/resource-policy: keep
    # Deliberately NO hook-delete-policy.
    #
    # `before-hook-creation` deadlocks the sync: the claim cannot go away while
    # a Job pod still references it, and the completed dump pod is kept for its
    # logs, so the controller sits on "waiting for deletion of hook
    # PersistentVolumeClaim/<release>-migration" until the pod is removed by
    # hand. ArgoCD deletes it despite `resource-policy: keep`.
    #
    # It is also unsafe: the claim holds the ONLY copy of the directory between
    # the dump and a verified reload. Deleting and recreating it on a retry
    # throws that copy away - and if the retry happens after the data directory
    # was rebuilt, the dump Job then finds the new version already serving,
    # decides there is nothing to migrate, and clears the state. Empty tree, no
    # dump, no state.
    #
    # Applying an existing claim is a no-op, so nothing needs deleting.
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.majorUpgrade.persistence.size | quote }}
  {{- with .Values.majorUpgrade.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
