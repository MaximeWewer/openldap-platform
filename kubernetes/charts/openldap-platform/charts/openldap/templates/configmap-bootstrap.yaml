{{- /*
Bootstrap ConfigMap - holds:
  * bootstrap.sh          - initContainer entrypoint (idempotent, mode-aware).
                            Standalone: seed cn=config + base data.
                            Mirror / multi-master: same, plus per-pod
                            olcServerID, olcMirrorMode: TRUE, syncrepl entries
                            towards every in-cluster peer + externalPeers, and
                            a replicator service account added to the tree.
  * slapd-config.ldif     - cn=config seed, Helm-templated for values-driven
                            knobs. Runtime placeholders substituted by
                            bootstrap.sh:
                              __ADMIN_PW_HASH__        (data admin)
                              __CONFIG_ADMIN_PW_HASH__ (cn=config admin)
                              __SERVER_ID_LINE__       (empty in standalone)
                              __MIRRORMODE_LINE__      (empty in standalone)
                              __SYNCREPL_BLOCK__       (empty in standalone)
                            Plus, only when replication.replicateConfig is on
                            (HA + writable pods):
                              __CONFIG_SYNCREPL_BLOCK__
                              __CONFIG_MIRRORMODE_LINE__
                              __CONFIG_SYNCPROV_BLOCK__
  * base-data.ldif        - dc=<suffix> + OUs + (HA) replicator service
                            account. Loaded on ordinal 0 only when HA and
                            replication.seedOnOrdinalZeroOnly=true (default).
*/ -}}
{{- if .Values.existingBootstrapConfigMap -}}
# Chart-managed bootstrap ConfigMap skipped - using existingBootstrapConfigMap: {{ .Values.existingBootstrapConfigMap }}
{{- else -}}
{{- $ha := ne .Values.mode "standalone" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openldap.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    SLAPD_D=/etc/openldap/slapd.d
    MDB_DIR=/var/lib/openldap/openldap-data
    ACCESSLOG_DIR=/var/lib/openldap/accesslog-data
    OWNER="${OWNER_UID:-101}:${OWNER_GID:-102}"
    OK_MARKER="${SLAPD_D}/.bootstrap-ok"
    TOPO_HASH_FILE="${SLAPD_D}/.topology-hash"

    # Alpine base image - install slapd tools (idempotent, no-op if cached).
    if ! command -v slapadd >/dev/null 2>&1; then
      echo "[bootstrap] Installing packages: ${APK_PACKAGES}"
      apk add --no-cache ${APK_PACKAGES} >/dev/null
    fi

    # Derive ordinal from POD_NAME (StatefulSet pod names end in -N).
    ORDINAL=0
    if [ -n "${POD_NAME:-}" ]; then
      ORDINAL="${POD_NAME##*-}"
    fi
    echo "[bootstrap] mode=${MODE:-standalone} pod=${POD_NAME:-?} ordinal=${ORDINAL}"

    # For mode=multi-master, resolve REPLICA_COUNT from the LIVE StatefulSet
    # spec at boot rather than trusting the env var (which is baked from
    # .Values.replicaCount at helm render time). This lets HPA-driven scale
    # events propagate to every pod's cn=config peer list - new pods created
    # by an HPA scale-up see the correct count, existing pods restarted by
    # the scale-watcher recompute their topology hash against the live value.
    # Falls back to the env value if the API call fails.
    if [ "${MODE:-standalone}" = "multi-master" ] && [ -n "${STS_NAME:-}" ]; then
      SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
      if [ -r "${SA_DIR}/token" ]; then
        # Ensure curl + jq are present (the apk step above only pulls openldap
        # packages). Root: bootstrap always runs as UID 0 in the initContainer.
        if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
          apk add --no-cache curl jq >/dev/null 2>&1 || true
        fi
        API_TOKEN=$(cat "${SA_DIR}/token")
        API_NS=$(cat "${SA_DIR}/namespace" 2>/dev/null || echo "${NAMESPACE}")
        LIVE_REPLICAS=$(curl -sf \
          --cacert "${SA_DIR}/ca.crt" \
          -H "Authorization: Bearer ${API_TOKEN}" \
          "https://kubernetes.default.svc/apis/apps/v1/namespaces/${API_NS}/statefulsets/${STS_NAME}" \
          2>/dev/null | jq -r '.spec.replicas // empty' 2>/dev/null)
        if [ -n "${LIVE_REPLICAS}" ] && [ "${LIVE_REPLICAS}" -gt 0 ] 2>/dev/null; then
          if [ "${LIVE_REPLICAS}" != "${REPLICA_COUNT:-}" ]; then
            echo "[bootstrap] REPLICA_COUNT env=${REPLICA_COUNT:-?} - using live STS spec.replicas=${LIVE_REPLICAS}"
          else
            echo "[bootstrap] Live STS spec.replicas=${LIVE_REPLICAS} matches env - OK"
          fi
          REPLICA_COUNT="${LIVE_REPLICAS}"
        else
          echo "[bootstrap] Live STS query failed - falling back to REPLICA_COUNT env=${REPLICA_COUNT:-1}"
        fi
      else
        echo "[bootstrap] No SA token at ${SA_DIR}/token - falling back to REPLICA_COUNT env=${REPLICA_COUNT:-1}"
      fi
    fi

    # Hash of every input that shapes cn=config's peer topology. When any
    # of these changes across upgrades, the pod restarts (checksum/topology
    # annotation on the PodTemplateSpec) and this script wipes slapd.d to
    # regenerate cn=config against the new inputs. Data (${MDB_DIR}) is left
    # untouched - the mdb DB survives; only the config DB is rebuilt.
    DESIRED_TOPO_HASH=$(printf '%s\n' \
      "${MODE:-standalone}" \
      "${NODE_ROLE:-writable}" \
      "${REPLICA_COUNT:-1}" \
      "${SERVER_ID_BASE:-1}" \
      "${READONLY_SERVER_ID_BASE:-100}" \
      "${EXTERNAL_PEERS:-}" \
      "${SUFFIX:-}" \
      "${REPLICATE_CONFIG:-false}" \
      | sha256sum | cut -d' ' -f1)

    RECONCILE_MODE=0
    if [ -f "${OK_MARKER}" ]; then
      CURRENT_TOPO_HASH=$(cat "${TOPO_HASH_FILE}" 2>/dev/null || echo "")
      if [ "${CURRENT_TOPO_HASH}" = "${DESIRED_TOPO_HASH}" ]; then
        echo "[bootstrap] Marker present + topology unchanged - skipping."
        chown -R "${OWNER}" "${SLAPD_D}" "${MDB_DIR}" "${ACCESSLOG_DIR}"
        exit 0
      fi
      echo "[bootstrap] Topology changed (was=${CURRENT_TOPO_HASH:-<none>} now=${DESIRED_TOPO_HASH})"
      echo "[bootstrap] Wiping slapd.d (data preserved in ${MDB_DIR}) and re-bootstrapping."
      rm -rf "${SLAPD_D}"/* "${OK_MARKER}" "${TOPO_HASH_FILE}" 2>/dev/null || true
      RECONCILE_MODE=1
    fi

    if [ -d "${SLAPD_D}" ] && [ -n "$(ls -A ${SLAPD_D} 2>/dev/null)" ]; then
      echo "[bootstrap] Partial state detected (no success marker) - wiping and restarting."
      # A partial FIRST bootstrap needs a full wipe (data too). Reconcile mode
      # already handled its own wipe above and NEVER hits this branch.
      rm -rf "${SLAPD_D}"/* "${MDB_DIR}"/* "${ACCESSLOG_DIR}"/* 2>/dev/null || true
    fi

    if [ ! -f /secrets/admin-password ] || [ ! -f /secrets/config-admin-password ]; then
      echo "[bootstrap] Admin secrets missing under /secrets" >&2
      exit 1
    fi

    ADMIN_HASH=$(slappasswd -s "$(cat /secrets/admin-password)")
    CONFIG_HASH=$(slappasswd -s "$(cat /secrets/config-admin-password)")

    # -------- HA-specific: server ID + syncrepl block + replicator hash. -----
    SERVER_ID_FILE=""
    MIRRORMODE_LINE=""
    SYNCREPL_FILE=""
    REPLICATOR_HASH=""
    CONFIG_SYNCREPL_FILE=""
    CONFIG_MIRRORMODE_LINE=""
    CONFIG_SYNCPROV_FILE=""

    # cn=config replication is writable-pods-only. A read-only consumer that
    # pulled cn=config would inherit olcMirrorMode: TRUE from the writable
    # pool and silently stop being read-only.
    REPLICATE_CONFIG_EFFECTIVE=false
    if [ "${MODE:-standalone}" != "standalone" ] \
       && [ "${NODE_ROLE:-writable}" = "writable" ] \
       && [ "${REPLICATE_CONFIG:-false}" = "true" ]; then
      REPLICATE_CONFIG_EFFECTIVE=true
    fi

    if [ "${MODE:-standalone}" != "standalone" ]; then
      if [ ! -f /replicator/replicator-password ]; then
        echo "[bootstrap] Replicator secret missing under /replicator" >&2
        exit 1
      fi
      REPLICATOR_PW=$(cat /replicator/replicator-password)
      REPLICATOR_HASH=$(slappasswd -s "$REPLICATOR_PW")

      # Read-only consumer pods use a distinct serverIdBase and never accept
      # writes - olcReadOnly: TRUE substitutes olcMirrorMode.
      SERVER_ID_FILE=$(mktemp)
      if [ "${NODE_ROLE:-writable}" = "readonly" ]; then
        SERVER_ID=$((${READONLY_SERVER_ID_BASE:-100} + ORDINAL))
        echo "olcServerID: ${SERVER_ID}" > "$SERVER_ID_FILE"
        if [ "${READONLY_ENFORCE:-true}" = "true" ]; then
          MIRRORMODE_LINE="olcReadOnly: TRUE"
        else
          MIRRORMODE_LINE=""
        fi
      else
        SERVER_ID=$((${SERVER_ID_BASE:-1} + ORDINAL))
        if [ "${REPLICATE_CONFIG_EFFECTIVE}" = "true" ]; then
          # URL form, IDENTICAL on every writable pod. Required because the
          # whole cn=config replicates, root entry included: a single-int
          # olcServerID would be overwritten by whichever peer wrote last.
          # Each pod picks its own line by matching the URL against one of its
          # listeners - which is why the StatefulSet pins slapd's `-h` to this
          # FQDN instead of `ldap:///` (0.0.0.0 never matches a host-specific
          # URL). It is ALSO what makes slapd drop the syncrepl entry pointing
          # at itself (provider URL == own identity URL). Without that match a
          # node consumes its own config and syncprov answers its own consumer
          # thread with `(53) Server is unwilling to perform`, stalling the
          # real consumers.
          # The pod FQDN is in /etc/hosts, so it resolves without cluster DNS.
          : > "$SERVER_ID_FILE"
          i=0
          while [ "$i" -lt "${REPLICA_COUNT}" ]; do
            echo "olcServerID: $((${SERVER_ID_BASE:-1} + i)) ldap://${SVC_NAME}-${i}.${HEADLESS_SVC}.${NAMESPACE}.svc.cluster.local:${REPLICA_LDAP_PORT}" \
              >> "$SERVER_ID_FILE"
            i=$((i + 1))
          done
        else
          echo "olcServerID: ${SERVER_ID}" > "$SERVER_ID_FILE"
        fi
        MIRRORMODE_LINE="olcMirrorMode: TRUE"
      fi

      # Build peer URI list.
      #   writable: every in-cluster writable pod + external peers (mesh)
      #   readonly: only writable pods (RO does not consume from RO)
      # Peer FQDN follows the StatefulSet + headless service convention:
      #   <sts-name>-<i>.<headless>.<ns>.svc.cluster.local
      PEERS=""
      i=0
      while [ "$i" -lt "${REPLICA_COUNT}" ]; do
        PEERS="${PEERS} ldap://${SVC_NAME}-${i}.${HEADLESS_SVC}.${NAMESPACE}.svc.cluster.local:${REPLICA_LDAP_PORT}"
        i=$((i + 1))
      done
      if [ -n "${EXTERNAL_PEERS:-}" ] && [ "${NODE_ROLE:-writable}" = "writable" ]; then
        OLDIFS=$IFS
        IFS=,
        for p in $EXTERNAL_PEERS; do
          [ -n "$p" ] && PEERS="${PEERS} ${p}"
        done
        IFS=$OLDIFS
      fi

      # Emit one olcSyncRepl entry per peer. rid must be unique per replica.
      # StartTLS + tls_reqcert flags are appended per-URI when set.
      SYNCREPL_FILE=$(mktemp)
      RID=1
      for uri in $PEERS; do
        RID_PADDED=$(printf '%03d' "$RID")
        EXTRA_TLS=""
        # StartTLS only relevant for plaintext ldap:// URIs.
        case "$uri" in
          ldap://*)
            [ -n "${STARTTLS:-}" ] && EXTRA_TLS="${EXTRA_TLS} starttls=${STARTTLS}"
            ;;
        esac
        [ -n "${TLS_REQCERT:-}" ] && EXTRA_TLS="${EXTRA_TLS} tls_reqcert=${TLS_REQCERT}"
        cat >> "$SYNCREPL_FILE" <<EOF
    olcSyncRepl: rid=${RID_PADDED} provider=${uri}
      bindmethod=simple binddn="${REPLICATOR_DN}"
      credentials="${REPLICATOR_PW}"
      searchbase="${SUFFIX}"
      type=refreshAndPersist retry="${SYNCREPL_RETRY}"
      timeout=1 schemachecking=on${EXTRA_TLS}
      logbase="cn=accesslog"
      logfilter="(&(objectClass=auditWriteObject)(reqResult=0))"
      syncdata=accesslog
    EOF
        RID=$((RID + 1))
      done
      echo "[bootstrap] built $(($RID - 1)) syncrepl providers, serverID=${SERVER_ID}"

      # ---- cn=config replication (writable pods, in-cluster peers only) ----
      # ONE syncrepl per peer over the WHOLE cn=config. Not several partial
      # ones with narrower searchbases: syncrepl entries on the same database
      # share a single contextCSN, so one advancing it makes the others believe
      # they are current and silently skip changes - measured, the consumer
      # reports an up-to-date contextCSN while its entries are stale.
      # Self IS listed: the list must be identical on every pod (it replicates
      # too), and slapd drops the self entry at runtime by matching the
      # provider URL against its own URL-form olcServerID.
      # Deliberately NOT extended to EXTERNAL_PEERS: cn=config carries the
      # per-cluster serverIdBase and peer list.
      # Not delta-syncrepl: the accesslog overlay is on {1}mdb only.
      if [ "${REPLICATE_CONFIG_EFFECTIVE}" = "true" ]; then
        CONFIG_PW=$(cat /secrets/config-admin-password)
        CONFIG_SYNCREPL_FILE=$(mktemp)
        RID=101
        i=0
        while [ "$i" -lt "${REPLICA_COUNT}" ]; do
          uri="ldap://${SVC_NAME}-${i}.${HEADLESS_SVC}.${NAMESPACE}.svc.cluster.local:${REPLICA_LDAP_PORT}"
          EXTRA_TLS=""
          [ -n "${STARTTLS:-}" ] && EXTRA_TLS="${EXTRA_TLS} starttls=${STARTTLS}"
          [ -n "${TLS_REQCERT:-}" ] && EXTRA_TLS="${EXTRA_TLS} tls_reqcert=${TLS_REQCERT}"
          # rid namespace 1xx keeps config rids clear of the mdb rids above.
          # binddn is the config rootDN: it bypasses the {0}config ACL.
          cat >> "$CONFIG_SYNCREPL_FILE" <<EOF
    olcSyncRepl: rid=$(printf '%03d' "$RID") provider=${uri}
      bindmethod=simple binddn="${CONFIG_ADMIN_DN}"
      credentials="${CONFIG_PW}"
      searchbase="cn=config"
      type=refreshAndPersist retry="${SYNCREPL_RETRY}"
      timeout=1${EXTRA_TLS}
    EOF
          RID=$((RID + 1))
          i=$((i + 1))
        done
        CONFIG_MIRRORMODE_LINE="olcMirrorMode: TRUE"
        CONFIG_SYNCPROV_FILE=$(mktemp)
        cat > "$CONFIG_SYNCPROV_FILE" <<EOF
    dn: olcOverlay=syncprov,olcDatabase={0}config,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcSyncProvConfig
    olcOverlay: syncprov
    olcSpCheckpoint: ${CONFIG_SYNCPROV_CHECKPOINT}
    olcSpSessionLog: ${CONFIG_SYNCPROV_SESSIONLOG}

    EOF
        echo "[bootstrap] cn=config replication ON - $((RID - 101)) providers, URL-form serverID"
        if [ -n "${EXTERNAL_PEERS:-}" ]; then
          echo "[bootstrap] NOTE: externalPeers are excluded from cn=config replication by design"
        fi
      fi

      # ---- cn=schema slice for read-only consumers -------------------------
      # A RO replica must NOT consume the whole cn=config: it would inherit the
      # writable pool's olcMirrorMode/olcServerID and stop being read-only.
      # But it MUST track the schema: its syncrepl runs with schemachecking=on,
      # so an entry using an objectClass added at runtime on the writable pool
      # is rejected - and that rejection STALLS the whole replication stream,
      # silently, including every later entry.
      #
      # So: replicate the cn=schema subtree ONLY. No olcMirrorMode and no
      # syncprov are added, which leaves {0}config a pure shadow here - local
      # cn=config writes are refused on a RO pod, which is what we want.
      # olcServerID stays in the single-int form: the `cn=config` root entry is
      # outside this searchbase, so nothing overwrites it.
      if [ "${NODE_ROLE:-writable}" = "readonly" ] && [ "${REPLICATE_CONFIG:-false}" = "true" ]; then
        CONFIG_PW=$(cat /secrets/config-admin-password)
        CONFIG_SYNCREPL_FILE=$(mktemp)
        RID=201
        i=0
        while [ "$i" -lt "${REPLICA_COUNT}" ]; do
          uri="ldap://${SVC_NAME}-${i}.${HEADLESS_SVC}.${NAMESPACE}.svc.cluster.local:${REPLICA_LDAP_PORT}"
          EXTRA_TLS=""
          [ -n "${STARTTLS:-}" ] && EXTRA_TLS="${EXTRA_TLS} starttls=${STARTTLS}"
          [ -n "${TLS_REQCERT:-}" ] && EXTRA_TLS="${EXTRA_TLS} tls_reqcert=${TLS_REQCERT}"
          # rid namespace 2xx keeps these clear of the mdb (0xx) and full-config
          # (1xx) rids.
          cat >> "$CONFIG_SYNCREPL_FILE" <<EOF
    olcSyncRepl: rid=$(printf '%03d' "$RID") provider=${uri}
      bindmethod=simple binddn="${CONFIG_ADMIN_DN}"
      credentials="${CONFIG_PW}"
      searchbase="cn=schema,cn=config"
      type=refreshAndPersist retry="${SYNCREPL_RETRY}"
      timeout=1${EXTRA_TLS}
    EOF
          RID=$((RID + 1))
          i=$((i + 1))
        done
        echo "[bootstrap] cn=schema replication ON (read-only consumer) - $((RID - 201)) providers"
      fi
    fi

    mkdir -p "${SLAPD_D}" "${MDB_DIR}" "${ACCESSLOG_DIR}"

    # Render cn=config with password hashes and HA markers.
    RENDERED_CONFIG=$(mktemp)
    RENDERED_DATA=$(mktemp)
    trap 'rm -f "${RENDERED_CONFIG}" "${RENDERED_DATA}" "${SYNCREPL_FILE:-}" "${SERVER_ID_FILE:-}" "${CONFIG_SYNCREPL_FILE:-}" "${CONFIG_SYNCPROV_FILE:-}"' EXIT

    # Build a sed script file - safer than shell word-splitting when
    # substitution values contain spaces (e.g. "olcMirrorMode: TRUE").
    SED_SCRIPT=$(mktemp)
    {
      printf 's|__ADMIN_PW_HASH__|%s|\n' "${ADMIN_HASH}"
      printf 's|__CONFIG_ADMIN_PW_HASH__|%s|\n' "${CONFIG_HASH}"
      printf 's|__MIRRORMODE_LINE__|%s|\n' "${MIRRORMODE_LINE}"
      printf 's|__CONFIG_MIRRORMODE_LINE__|%s|\n' "${CONFIG_MIRRORMODE_LINE}"
    } > "${SED_SCRIPT}"

    # Multi-line blocks are inserted via awk (sed multiline is not portable).
    # A placeholder whose file is unset/empty has its line DELETED, which is
    # what standalone (no serverID, no syncrepl) and cn=config-replication-off
    # both want.
    awk -v sid="${SERVER_ID_FILE}" \
        -v syn="${SYNCREPL_FILE}" \
        -v csyn="${CONFIG_SYNCREPL_FILE}" \
        -v csp="${CONFIG_SYNCPROV_FILE}" '
      function emit(f,   line) {
        if (f == "") return
        while ((getline line < f) > 0) print line
        close(f)
      }
      /__SERVER_ID_LINE__/        { emit(sid);  next }
      /__SYNCREPL_BLOCK__/        { emit(syn);  next }
      /__CONFIG_SYNCREPL_BLOCK__/ { emit(csyn); next }
      /__CONFIG_SYNCPROV_BLOCK__/ { emit(csp);  next }
      { print }
    ' /bootstrap/slapd-config.ldif | sed -f "${SED_SCRIPT}" > "${RENDERED_CONFIG}"
    rm -f "${SED_SCRIPT}"

    # Custom schemas - append `include:` lines to the cn=schema block right
    # before slapadd. Files come from /custom-schemas (projected volume
    # combining the chart-managed ConfigMap and any user existingConfigMap).
    if [ -d /custom-schemas ]; then
      CUSTOM_SCHEMAS=""
      for f in /custom-schemas/*.ldif; do
        [ -f "$f" ] || continue
        CUSTOM_SCHEMAS="${CUSTOM_SCHEMAS}include: file://$f\n"
      done
      if [ -n "${CUSTOM_SCHEMAS}" ]; then
        echo "[bootstrap] Injecting $(ls /custom-schemas/*.ldif 2>/dev/null | wc -l) custom schema file(s)"
        # Insert AFTER the last built-in `include:` line inside cn=schema.
        awk -v extra="$(printf '%b' "${CUSTOM_SCHEMAS}")" '
          /^include: file:\/\/\/etc\/openldap\/schema/ { last=NR; buf[NR]=$0; next }
          { buf[NR]=$0 }
          END {
            for (i=1;i<=NR;i++) {
              print buf[i]
              if (i==last) printf "%s", extra
            }
          }
        ' "${RENDERED_CONFIG}" > "${RENDERED_CONFIG}.tmp" && mv "${RENDERED_CONFIG}.tmp" "${RENDERED_CONFIG}"
      fi
    fi

    echo "[bootstrap] Loading cn=config"
    slapadd -n 0 -F "${SLAPD_D}" -l "${RENDERED_CONFIG}"

    # Base data: standalone always, HA only on ordinal 0 (default) so peers
    # sync from ordinal 0 instead of concurrently seeding split-brain state.
    # Read-only pods NEVER seed - they only pull from writable peers.
    # Reconcile mode NEVER seeds - data is already in ${MDB_DIR}, we only
    # rebuilt cn=config on top of it.
    SHOULD_SEED_DATA=1
    if [ "${MODE:-standalone}" != "standalone" ] \
       && [ "${SEED_ORDINAL_ZERO_ONLY:-true}" = "true" ] \
       && [ "${ORDINAL}" != "0" ]; then
      SHOULD_SEED_DATA=0
    fi
    if [ "${NODE_ROLE:-writable}" = "readonly" ]; then
      SHOULD_SEED_DATA=0
    fi
    if [ "${RECONCILE_MODE:-0}" = "1" ]; then
      SHOULD_SEED_DATA=0
    fi

    if [ "${SHOULD_SEED_DATA}" = "1" ]; then
      # Substitute replicator hash into base data (empty in standalone → the
      # replicator entry is stripped by the ${REPLICATOR_HASH:+…} guard in the
      # template).
      sed -e "s|__REPLICATOR_PW_HASH__|${REPLICATOR_HASH}|" \
          /bootstrap/base-data.ldif > "${RENDERED_DATA}"
      echo "[bootstrap] Loading base directory data"
      slapadd -n 1 -F "${SLAPD_D}" -l "${RENDERED_DATA}"

      # Custom data LDIFs - same seed pod, alphabetical order, one slapadd
      # per file so a bad LDIF only wastes its own file rather than the
      # whole batch. Files come from /custom-ldifs (projected volume).
      if [ -d /custom-ldifs ]; then
        for f in $(ls /custom-ldifs/*.ldif 2>/dev/null | sort); do
          echo "[bootstrap] Loading custom LDIF $(basename "$f")"
          slapadd -n 1 -F "${SLAPD_D}" -l "$f"
        done
      fi
    else
      echo "[bootstrap] ordinal=${ORDINAL} - skipping base data seed (will sync from ordinal 0)"
    fi

    echo "[bootstrap] chown -R ${OWNER}"
    chown -R "${OWNER}" "${SLAPD_D}" "${MDB_DIR}" "${ACCESSLOG_DIR}"

    # Topology hash - written BEFORE the OK marker so a mid-write crash
    # forces a re-reconcile on next boot rather than a stale-hash accept.
    printf '%s\n' "${DESIRED_TOPO_HASH}" > "${TOPO_HASH_FILE}"
    chown "${OWNER}" "${TOPO_HASH_FILE}"

    # Success marker - written LAST so a partial bootstrap forces a redo.
    date -u +%Y-%m-%dT%H:%M:%SZ > "${OK_MARKER}"
    chown "${OWNER}" "${OK_MARKER}"

    if [ "${RECONCILE_MODE:-0}" = "1" ]; then
      echo "[bootstrap] Reconcile done - cn=config rebuilt for the new topology."
    fi
    echo "[bootstrap] Done."

  slapd-config.ldif: |
    dn: cn=config
    objectClass: olcGlobal
    cn: config
    olcPidFile: /run/openldap/slapd.pid
    olcArgsFile: /run/openldap/slapd.args
    {{- if .Values.tls.enabled }}
    olcTLSCACertificateFile: /etc/openldap/certs/ca.crt
    olcTLSCertificateFile: /etc/openldap/certs/tls.crt
    olcTLSCertificateKeyFile: /etc/openldap/certs/tls.key
    olcTLSVerifyClient: never
    {{- end }}
    {{- if gt (int .Values.tls.minSSF) 0 }}
    olcSecurity: ssf={{ .Values.tls.minSSF }}
    {{- end }}
    {{- if .Values.tls.disallowPlainBind }}
    olcDisallows: bind_anon
    {{- end }}
    __SERVER_ID_LINE__

    dn: cn=module{{ "{" }}0{{ "}" }},cn=config
    objectClass: olcModuleList
    cn: module{{ "{" }}0{{ "}" }}
    olcModulePath: /usr/lib/openldap
    olcModuleLoad: back_mdb.so
    olcModuleLoad: memberof.so
    olcModuleLoad: refint.so
    olcModuleLoad: ppolicy.so
    olcModuleLoad: dynlist.so
    olcModuleLoad: accesslog.so
    {{- if $ha }}
    olcModuleLoad: syncprov.so
    {{- end }}

    dn: cn=schema,cn=config
    objectClass: olcSchemaConfig
    cn: schema

    include: file:///etc/openldap/schema/core.ldif
    {{- range .Values.directory.schemas }}
    include: file:///etc/openldap/schema/{{ . }}.ldif
    {{- end }}

    dn: olcDatabase={{ "{" }}-1{{ "}" }}frontend,cn=config
    objectClass: olcDatabaseConfig
    objectClass: olcFrontendConfig
    olcDatabase: {{ "{" }}-1{{ "}" }}frontend

    dn: olcDatabase={{ "{" }}0{{ "}" }}config,cn=config
    objectClass: olcDatabaseConfig
    olcDatabase: {{ "{" }}0{{ "}" }}config
    olcRootDN: {{ .Values.configAdmin.bindDN }}
    olcRootPW: __CONFIG_ADMIN_PW_HASH__
    olcAccess: {{ "{" }}0{{ "}" }}to * by dn.exact="{{ .Values.configAdmin.bindDN }}" manage by * none
    __CONFIG_SYNCREPL_BLOCK__
    __CONFIG_MIRRORMODE_LINE__

    __CONFIG_SYNCPROV_BLOCK__
    dn: olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcDatabaseConfig
    objectClass: olcMdbConfig
    olcDatabase: {{ "{" }}1{{ "}" }}mdb
    olcSuffix: {{ .Values.directory.suffix }}
    olcDbDirectory: /var/lib/openldap/openldap-data
    olcRootDN: {{ .Values.admin.bindDN }}
    olcRootPW: __ADMIN_PW_HASH__
    olcDbMaxSize: {{ int64 .Values.database.main.maxSizeBytes }}
    olcDbIndex: objectClass eq
    olcDbIndex: cn,sn,uid eq,pres,sub
    olcDbIndex: mail eq,sub
    olcDbIndex: member eq
    olcDbIndex: memberOf eq
    {{- if has "nis" .Values.directory.schemas }}
    olcDbIndex: uidNumber,gidNumber eq
    {{- end }}
    {{- if $ha }}
    olcDbIndex: entryCSN,entryUUID eq
    {{- end }}
    olcMonitoring: TRUE
    {{- /*
      ACL block on {1}mdb - either the user-provided customAcls (full
      replacement) or the chart defaults + any extraAcls (append). Every
      entry is `tpl`-rendered so users can reference values.
    */ -}}
    {{- $acls := .Values.customAcls -}}
    {{- if not $acls -}}
      {{- $acls = list -}}
      {{- $adminDN := .Values.admin.bindDN -}}
      {{- $suffix  := .Values.directory.suffix -}}
      {{- $replDN  := "" -}}
      {{- if $ha }}{{- $replDN = printf "%s,%s" .Values.replication.replicator.dn .Values.directory.suffix -}}{{- end }}
      {{- $acls = append $acls (printf `to attrs=userPassword by self write by dn.exact="%s" write %sby anonymous auth by * none` $adminDN (ternary (printf `by dn.exact="%s" read ` $replDN) "" $ha)) -}}
      {{- $acls = append $acls (printf `to dn.subtree="ou=policies,%s" by * read` $suffix) -}}
      {{- $acls = append $acls (printf `to dn.subtree="%s" by dn.exact="%s" write %sby users read by * none` $suffix $adminDN (ternary (printf `by dn.exact="%s" read ` $replDN) "" $ha)) -}}
      {{- range .Values.extraAcls -}}
        {{- $acls = append $acls . -}}
      {{- end -}}
    {{- end }}
    {{- range $i, $rule := $acls }}
    olcAccess: {{ printf "{%d}" $i }}{{ tpl $rule $ }}
    {{- end }}
    __SYNCREPL_BLOCK__
    __MIRRORMODE_LINE__
    {{ if $ha }}
    dn: olcOverlay=syncprov,olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcSyncProvConfig
    olcOverlay: syncprov
    olcSpCheckpoint: {{ .Values.replication.syncprov.checkpoint }}
    olcSpSessionLog: {{ .Values.replication.syncprov.sessionLog }}
    {{ end }}
    dn: olcOverlay=memberof,olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcMemberOf
    olcOverlay: memberof
    olcMemberOfRefInt: TRUE
    olcMemberOfGroupOC: groupOfNames
    olcMemberOfMemberAD: member
    olcMemberOfMemberOfAD: memberOf

    dn: olcOverlay=refint,olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcRefintConfig
    olcOverlay: refint
    olcRefintAttribute: uniqueMember
    olcRefintAttribute: member
    olcRefintAttribute: memberOf
    {{ if .Values.ppolicy.enabled }}
    dn: olcOverlay=ppolicy,olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcPPolicyConfig
    olcOverlay: ppolicy
    olcPPolicyDefault: {{ .Values.ppolicy.defaultPolicyRDN }},ou=policies,{{ .Values.directory.suffix }}
    olcPPolicyHashCleartext: {{ ternary "TRUE" "FALSE" .Values.ppolicy.hashCleartext }}
    {{ end }}
    dn: olcOverlay=dynlist,olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcDynListConfig
    olcOverlay: dynlist
    olcDynListAttrSet: groupOfUrls memberURL member+memberOf@groupOfNames

    dn: olcDatabase={{ "{" }}2{{ "}" }}mdb,cn=config
    objectClass: olcDatabaseConfig
    objectClass: olcMdbConfig
    olcDatabase: {{ "{" }}2{{ "}" }}mdb
    olcSuffix: cn=accesslog
    olcDbDirectory: /var/lib/openldap/accesslog-data
    olcRootDN: {{ .Values.configAdmin.bindDN }}
    olcDbMaxSize: {{ int64 .Values.database.accesslog.maxSizeBytes }}
    olcDbIndex: reqStart eq
    olcDbIndex: reqDN eq
    olcDbIndex: reqType eq
    olcDbIndex: reqResult eq
    {{- if $ha }}
    olcDbIndex: entryCSN,entryUUID,objectClass,reqEnd eq
    {{- end }}
    olcAccess: {{ "{" }}0{{ "}" }}to * by dn.exact="{{ .Values.configAdmin.bindDN }}" read {{ if $ha }}by dn.exact="{{ .Values.replication.replicator.dn }},{{ .Values.directory.suffix }}" read {{ end }}by * none
    {{ if $ha }}
    dn: olcOverlay=syncprov,olcDatabase={{ "{" }}2{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcSyncProvConfig
    olcOverlay: syncprov
    olcSpNoPresent: TRUE
    olcSpReloadHint: TRUE
    {{ end }}
    dn: olcOverlay=accesslog,olcDatabase={{ "{" }}1{{ "}" }}mdb,cn=config
    objectClass: olcOverlayConfig
    objectClass: olcAccessLogConfig
    olcOverlay: accesslog
    olcAccessLogDB: cn=accesslog
    olcAccessLogOps: {{ if $ha }}writes{{ else }}{{ .Values.accesslog.ops }}{{ end }}
    olcAccessLogSuccess: {{ if $ha }}TRUE{{ else }}{{ ternary "TRUE" "FALSE" .Values.accesslog.logSuccess }}{{ end }}
    olcAccessLogPurge: {{ .Values.accesslog.purge }}

    dn: olcDatabase={{ "{" }}3{{ "}" }}monitor,cn=config
    objectClass: olcDatabaseConfig
    objectClass: olcMonitorConfig
    olcDatabase: {{ "{" }}3{{ "}" }}monitor
    olcAccess: {{ "{" }}0{{ "}" }}to dn.subtree="cn=Monitor" by dn.exact="{{ .Values.configAdmin.bindDN }}" read by * none
    olcMonitoring: TRUE

  base-data.ldif: |
    dn: {{ .Values.directory.suffix }}
    objectClass: top
    objectClass: dcObject
    objectClass: organization
    o: {{ .Values.directory.organization }}
    dc: {{ (split "," .Values.directory.suffix)._0 | trimPrefix "dc=" }}
    {{- if .Values.directory.description }}
    description: {{ .Values.directory.description }}
    {{- end }}
    {{ range .Values.directory.organizationalUnits }}
    {{- $ouPath := trimPrefix "ou=" . }}
    dn: ou={{ $ouPath }},{{ $.Values.directory.suffix }}
    objectClass: organizationalUnit
    ou: {{ index (splitList "," $ouPath) 0 | trimPrefix "ou=" }}
    {{ end }}
    {{- if and .Values.ppolicy.enabled .Values.ppolicy.defaultPolicy.create }}
    {{- with .Values.ppolicy.defaultPolicy }}
    dn: {{ $.Values.ppolicy.defaultPolicyRDN }},ou=policies,{{ $.Values.directory.suffix }}
    objectClass: pwdPolicy
    objectClass: person
    cn: {{ $.Values.ppolicy.defaultPolicyRDN | trimPrefix "cn=" }}
    sn: default password policy
    pwdAttribute: userPassword
    pwdMinLength: {{ .minLength | int64 }}
    pwdMaxAge: {{ .maxAge | int64 }}
    pwdExpireWarning: {{ .expireWarning | int64 }}
    pwdInHistory: {{ .inHistory | int64 }}
    pwdCheckQuality: {{ .checkQuality | int64 }}
    pwdLockout: {{ ternary "TRUE" "FALSE" .lockout }}
    pwdLockoutDuration: {{ .lockoutDuration | int64 }}
    pwdMaxFailure: {{ .maxFailure | int64 }}
    pwdMustChange: {{ ternary "TRUE" "FALSE" .mustChange }}
    pwdAllowUserChange: {{ ternary "TRUE" "FALSE" .allowUserChange }}
    pwdSafeModify: {{ ternary "TRUE" "FALSE" .safeModify }}
    {{- end }}
    {{- end }}
    {{- if $ha }}

    dn: {{ .Values.replication.replicator.dn }},{{ .Values.directory.suffix }}
    objectClass: inetOrgPerson
    cn: {{ (split "," .Values.replication.replicator.dn)._0 | trimPrefix "cn=" }}
    sn: replicator
    userPassword: __REPLICATOR_PW_HASH__
    description: Delta-syncrepl bind account for peer-to-peer replication.
    {{- end }}
{{- end }}
